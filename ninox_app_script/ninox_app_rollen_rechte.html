 { t:["Der Aufbau: Organisation, Workspace, App","The structure: organization, workspace, app"],
   ben:["Du nennst die Ebenen von Ninox 4 in der richtigen Reihenfolge.","You name the levels of Ninox 4 in the right order."],
   l:[["Ninox 4 ist in Ebenen aufgebaut. Ganz oben steht die Organisation, sie ist die Heimat deines Teams in Ninox. Eine Organisation enthält einen oder mehrere Workspaces (Arbeitsbereiche).",
       "H:Von oben nach unten",
       "Organisation → Workspace → App → Tabellen, Ansichten und Seiten → Datensätze. Der Zugriff kann je nach App, Tabelle und Ansicht unterschiedlich sein. Genau dafür gibt es Rollen und Rechte.",
       "H:Beispiel",
       "Eine Firma hat eine Organisation. Darin gibt es die Workspaces „Vertrieb“ und „Personal“. Im Workspace „Vertrieb“ liegt die App „Kunden“ mit den Tabellen „Firmen“ und „Kontakte“.",
       "FOLD:Gut zu wissen|Modul oder App?","Du liest manchmal „Modul“. In der Dokumentation (docs.ninox.com) heißt die Ebene unter dem Workspace „App“. Der Begriff „Modul“ kommt in den geprüften Seiten nicht vor. Auch ein Team-Konzept wie in älteren Ninox-Texten gibt es in der Ninox-4-Dokumentation nicht.","ENDFOLD"],
      ["Ninox 4 is built in levels. At the top is the organization, the home of your team in Ninox. An organization contains one or more workspaces.",
       "H:From top to bottom",
       "Organization → workspace → app → tables, views and pages → records. Access can differ by app, table and view. That is exactly what roles and permissions are for.",
       "H:Example",
       "A company has one organization. In it there are the workspaces “Sales” and “HR”. In the workspace “Sales” is the app “Customers” with the tables “Companies” and “Contacts”.",
       "FOLD:Good to know|Module or app?","You sometimes read “module”. In the documentation (docs.ninox.com) the level below the workspace is called “app”. The term “module” does not appear in the pages checked. A team concept as in older Ninox texts does not exist in the Ninox 4 documentation either.","ENDFOLD"]],
   q:[
    {q:["Wie heißt in der Ninox-4-Doku die Ebene unter dem Workspace?","What is the level below the workspace called in the Ninox 4 docs?"],
     a:[["App","Team","Gruppe","Mandant"],["App","Team","Group","Tenant"]],
     e:["Unter dem Workspace liegt die App.","Below the workspace is the app."],
     p:["Reihenfolge: Organisation, Workspace, App.","Order: organization, workspace, app."]},
    {q:["Wie ist die Reihenfolge von oben nach unten?","What is the order from top to bottom?"],
     a:[["Organisation, Workspace, App","App, Workspace, Organisation","Workspace, Organisation, App","Organisation, App, Workspace"],["Organization, workspace, app","App, workspace, organization","Workspace, organization, app","Organization, app, workspace"]],
     e:["Oben steht die Organisation, darunter der Workspace, darunter die App.","At the top is the organization, below it the workspace, below it the app."],
     p:["Von groß nach klein: O, W, A.","From big to small: O, W, A."]},
    {q:["Was enthält eine Organisation?","What does an organization contain?"],
     a:[["Einen oder mehrere Workspaces","Genau eine einzige App","Nur Benutzer ohne Daten","Nur die Rechnungen"],["One or more workspaces","Exactly one single app","Only users without data","Only the invoices"]],
     e:["Eine Organisation enthält einen oder mehrere Workspaces.","An organization contains one or more workspaces."],
     p:["Organisation = Dach über mehreren Workspaces.","Organization = roof over several workspaces."]},
    {q:["Was liegt in einer App?","What is inside an app?"],
     a:[["Tabellen, Ansichten und Seiten mit Datensätzen","Nur Benutzer und ihre Rollen","Nur die Abrechnung der Organisation","Nur die API-Schlüssel des Workspaces"],["Tables, views and pages with records","Only users and their roles","Only the billing of the organization","Only the API keys of the workspace"]],
     e:["In einer App liegen Tabellen, Ansichten und Seiten; in den Tabellen stehen die Datensätze.","An app contains tables, views and pages; the records are in the tables."],
     p:["App = die eigentliche Anwendung mit Daten.","App = the actual application with data."]}]},

 { t:["Rollen in der Organisation","Roles in the organization"],
   ben:["Du unterscheidest Admin, Admin W/O Billing, Billing und Member.","You distinguish admin, admin w/o billing, billing and member."],
   l:[["Jeder Benutzer hat in der Organisation genau eine Rolle. Es gibt vier Organisationsrollen.",
       "H:Die vier Rollen",
       "Admin: volle Kontrolle über Organisationseinstellungen, Benutzer, Rollen, Billing und Abonnements. Admin W/O Billing: verwaltet Benutzer, Rollen, Einstellungen und Workspaces, aber nicht Billing und Abonnements. Billing: nur Zahlungen und Abonnements. Member: Zugriff auf Workspaces, aber keine Organisationsadministration.",
       "H:Merke",
       "Die Organisationsrolle regelt die Verwaltung der Organisation. Was jemand in einem Workspace darf, regelt eine eigene Workspace-Rolle (Lektion 3)."],
      ["Every user has exactly one role in the organization. There are four organization roles.",
       "H:The four roles",
       "Admin: full control over organization settings, users, roles, billing and subscriptions. Admin W/O Billing: manages users, roles, settings and workspaces, but not billing and subscriptions. Billing: only payments and subscriptions. Member: access to workspaces, but no organization administration.",
       "H:Remember",
       "The organization role governs the administration of the organization. What someone may do in a workspace is governed by a separate workspace role (lesson 3)."]],
   q:[
    {q:["Wie viele Organisationsrollen hat ein Benutzer?","How many organization roles does a user have?"],
     a:[["Genau eine","Beliebig viele","Keine","Zwei: eine für Daten, eine für Billing"],["Exactly one","Any number","None","Two: one for data, one for billing"]],
     e:["Jeder Benutzer hat genau eine Organisationsrolle.","Every user has exactly one organization role."],
     p:["Eine Person, eine Organisationsrolle.","One person, one organization role."]},
    {q:["Welche Rolle verwaltet nur Zahlungen und Abonnements?","Which role only manages payments and subscriptions?"],
     a:[["Billing","Member","Admin W/O Billing","Editor"],["Billing","Member","Admin W/O Billing","Editor"]],
     e:["Die Rolle Billing ist nur für Zahlungen und Abonnements zuständig.","The Billing role is only responsible for payments and subscriptions."],
     p:["Billing = Rechnungen, sonst nichts.","Billing = invoices, nothing else."]},
    {q:["Was darf Admin W/O Billing nicht?","What may Admin W/O Billing not do?"],
     a:[["Billing und Abonnements verwalten","Benutzer der Organisation verwalten","Rollen der Organisation verwalten","Workspaces der Organisation verwalten"],["Manage billing and subscriptions","Manage the users of the organization","Manage the roles of the organization","Manage the workspaces of the organization"]],
     e:["Admin W/O Billing darf alles verwalten außer Billing und Abonnements („without billing“).","Admin W/O Billing may manage everything except billing and subscriptions (“without billing”)."],
     p:["W/O = without: Admin ohne Billing.","W/O = without: admin without billing."]},
    {q:["Welche Organisationsrolle hat Zugriff auf Workspaces, aber keine Organisationsadministration?","Which organization role has access to workspaces but no organization administration?"],
     a:[["Member","Admin","Billing","Viewer"],["Member","Admin","Billing","Viewer"]],
     e:["Ein Member hat Zugriff auf Workspaces, aber keine Organisationsadministration. Viewer ist eine Workspace-Rolle.","A member has access to workspaces but no organization administration. Viewer is a workspace role."],
     p:["Member = mitarbeiten, nicht verwalten.","Member = take part, not administer."]}],
   dd:{de:{dd:1,q:"Ordne zu: Welche Organisationsrolle passt zur Beschreibung?",slots:["Volle Kontrolle über Organisation, Benutzer, Rollen und Billing","Verwaltet Benutzer und Einstellungen, aber kein Billing","Verwaltet nur Zahlungen und Abonnements","Zugriff auf Workspaces ohne Organisationsadministration"],items:["Admin","Admin W/O Billing","Billing","Member"],e:"Admin hat volle Kontrolle, Admin W/O Billing alles außer Billing, Billing nur Zahlungen, Member nur Workspace-Zugriff."},
       en:{dd:1,q:"Match them: which organization role fits the description?",slots:["Full control over organization, users, roles and billing","Manages users and settings, but no billing","Manages only payments and subscriptions","Access to workspaces without organization administration"],items:["Admin","Admin W/O Billing","Billing","Member"],e:"Admin has full control, Admin W/O Billing everything except billing, Billing only payments, Member only workspace access."}}},

 { t:["Rollen im Workspace","Roles in the workspace"],
   ben:["Du erklärst Admin, Editor, Viewer und None und warum Organisations- und Workspace-Rolle getrennt sind.","You explain admin, editor, viewer and none and why organization and workspace role are separate."],
   l:[["Im Workspace bekommt jedes Mitglied eine Standardrolle (Default Workspace Role). Es gibt vier: Admin, Editor, Viewer und None.",
       "H:Was die Standardrollen dürfen",
       "Admin: Vollzugriff auf den Workspace und behält ihn immer. Editor: Daten lesen, anlegen, bearbeiten und löschen. Viewer: Daten lesen und exportieren, aber nicht anlegen, bearbeiten oder löschen. None: keine Standardrolle, der Zugriff kommt dann nur über Custom Roles (Lektion 4).",
       "H:Beispiel",
       "Anna ist Admin in der Organisation, im Workspace „Personal“ aber nur Viewer. Sie kann dort lesen und exportieren, aber nichts ändern. Der Zugriff im Workspace ist getrennt vom Organisationszugriff."],
      ["In the workspace every member gets a default workspace role. There are four: admin, editor, viewer and none.",
       "H:What the default roles may do",
       "Admin: full access to the workspace and always keeps it. Editor: read, create, edit and delete data. Viewer: read and export data, but not create, edit or delete. None: no default role, access then only comes through custom roles (lesson 4).",
       "H:Example",
       "Anna is admin in the organization, but only viewer in the workspace “HR”. There she can read and export, but change nothing. Access in the workspace is separate from access to the organization."]],
   q:[
    {q:["Welche Standardrolle darf Daten lesen, anlegen, bearbeiten und löschen?","Which default role may read, create, edit and delete data?"],
     a:[["Editor","Viewer","None","Member"],["Editor","Viewer","None","Member"]],
     e:["Der Editor darf Daten lesen, anlegen, bearbeiten und löschen.","The editor may read, create, edit and delete data."],
     p:["Editor = ändern erlaubt.","Editor = changing allowed."]},
    {q:["Was darf ein Viewer?","What may a viewer do?"],
     a:[["Daten lesen und exportieren","Daten bearbeiten und löschen","Neue Datensätze anlegen","Benutzer einladen"],["Read and export data","Edit and delete data","Create new records","Invite users"]],
     e:["Ein Viewer darf Daten lesen und exportieren, aber nichts anlegen, bearbeiten oder löschen.","A viewer may read and export data, but not create, edit or delete anything."],
     p:["Viewer = ansehen, nicht ändern.","Viewer = look, do not change."]},
    {q:["Was bedeutet die Standardrolle None?","What does the default role None mean?"],
     a:[["Keine Standardrolle: Zugriff nur über Custom Roles","Vollzugriff auf den Workspace ohne Einschränkung","Nur Leserechte auf alle Daten im Workspace","Der Benutzer wird sofort aus der Organisation gelöscht"],["No default role: access only via custom roles","Full access to the workspace without restriction","Read-only rights on all data in the workspace","The user is deleted from the organization immediately"]],
     e:["None heißt: keine Standardrolle. Der Zugriff kommt dann nur über Custom Roles.","None means: no default role. Access then only comes through custom roles."],
     p:["None = nichts von allein.","None = nothing by default."]},
    {q:["Sind Organisationsrolle und Workspace-Rolle dasselbe?","Are the organization role and the workspace role the same?"],
     a:[["Nein, sie sind getrennt und werden getrennt gepflegt","Ja, eine Rolle gilt automatisch überall","Ja, aber nur für Admins","Nein, es gibt nur die Organisationsrolle"],["No, they are separate and maintained separately","Yes, one role applies everywhere automatically","Yes, but only for admins","No, there is only the organization role"]],
     e:["Organisations- und Workspace-Rolle sind getrennt. Ein Organisations-Admin kann im Workspace eingeschränkt sein.","Organization and workspace role are separate. An organization admin can be restricted in a workspace."],
     p:["Zwei Schlüssel, zwei Türen.","Two keys, two doors."]}],
   dd:{de:{dd:1,q:"Ordne zu: Welche Standardrolle im Workspace passt?",slots:["Lesen, anlegen, bearbeiten und löschen","Lesen und exportieren, nichts ändern","Keine Standardrolle, Zugriff nur über Custom Roles","Vollzugriff auf den Workspace, immer"],items:["Editor","Viewer","None","Admin"],e:"Editor darf Daten ändern, Viewer nur lesen und exportieren, None hat keine Standardrolle, Admin hat immer Vollzugriff."},
       en:{dd:1,q:"Match them: which default workspace role fits?",slots:["Read, create, edit and delete","Read and export, change nothing","No default role, access only via custom roles","Full access to the workspace, always"],items:["Editor","Viewer","None","Admin"],e:"Editor may change data, viewer may only read and export, none has no default role, admin always has full access."}}},

 { t:["Custom Roles: eigene Rollen","Custom roles: your own roles"],
   ben:["Du erklärst, wo Custom Roles entstehen und wann sie wirken.","You explain where custom roles are created and when they take effect."],
   l:[["Reichen die vier Standardrollen nicht, legst du Custom Roles an, zum Beispiel „Manager“. Sie sind eigene Rollen mit eigenen Rechten.",
       "H:Wo und wie",
       "Custom Roles werden auf Organisationsebene angelegt: Einstellungen (Zahnrad) → Organization → Users & roles → Workspace custom role management → Create role (Name, optional Beschreibung). Im Workspace weist du sie Benutzern zu. In allen Workspaces der Organisation lassen sie sich wiederverwenden.",
       "H:Wann sie wirken",
       "Eine Custom Role wirkt erst, wenn sie im Workspace zugewiesen und in App-, Tabellen- oder Feldrechten verwendet wird. Löschst du sie, werden alle Zuweisungen und Berechtigungen entfernt. Das lässt sich nicht rückgängig machen."],
      ["If the four default roles are not enough, you create custom roles, for example “Manager”. They are your own roles with your own permissions.",
       "H:Where and how",
       "Custom roles are created at organization level: settings (gear) → Organization → Users & roles → Workspace custom role management → Create role (name, optional description). In the workspace you assign them to users. They can be reused in all workspaces of the organization.",
       "H:When they take effect",
       "A custom role only takes effect once it is assigned in the workspace and used in app, table or field permissions. If you delete it, all assignments and permissions are removed. This cannot be undone."]],
   q:[
    {q:["Auf welcher Ebene werden Custom Roles angelegt?","At which level are custom roles created?"],
     a:[["Auf Organisationsebene","In der einzelnen Tabelle","In einem einzelnen Feld","In einem einzelnen Datensatz"],["At organization level","In the single table","In a single field","In a single record"]],
     e:["Custom Roles legst du auf Organisationsebene an und weist sie im Workspace zu.","You create custom roles at organization level and assign them in the workspace."],
     p:["Anlegen oben, zuweisen unten.","Create at the top, assign below."]},
    {q:["Wann hat eine Custom Role eine Wirkung?","When does a custom role take effect?"],
     a:[["Wenn sie in App-, Tabellen- oder Feldrechten verwendet wird","Sofort nach dem Anlegen für alle Benutzer im Workspace","Nur bei Benutzern mit der Organisationsrolle Billing","Nur wenn ein Viewer sie ausdrücklich bestätigt hat"],["When it is used in app, table or field permissions","Immediately after creation for all users in the workspace","Only for users with the organization role billing","Only when a viewer has explicitly confirmed it"]],
     e:["Eine Custom Role wirkt erst, wenn sie zugewiesen und in Rechten verwendet wird.","A custom role only takes effect once it is assigned and used in permissions."],
     p:["Rolle anlegen reicht nicht, sie braucht Rechte.","Creating a role is not enough, it needs permissions."]},
    {q:["Was passiert beim Löschen einer Custom Role?","What happens when you delete a custom role?"],
     a:[["Zuweisungen und Berechtigungen werden entfernt, nicht rückgängig","Die Rolle wird nur ausgeblendet und lässt sich wiederherstellen","Nur der Name der Rolle wird gelöscht","Nichts, alle Rechte bleiben bestehen"],["Assignments and permissions are removed, cannot be undone","The role is only hidden and can be restored","Only the name of the role is deleted","Nothing, all permissions stay in place"]],
     e:["Das Löschen entfernt alle Zuweisungen und Berechtigungen und lässt sich nicht rückgängig machen.","Deleting removes all assignments and permissions and cannot be undone."],
     p:["Erst prüfen, wo die Rolle benutzt wird, dann löschen.","First check where the role is used, then delete."]},
    {q:["Kann eine Custom Role in mehreren Workspaces genutzt werden?","Can a custom role be used in several workspaces?"],
     a:[["Ja, innerhalb derselben Organisation","Nein, nur in dem Workspace, in dem sie entstand","Nur wenn der Benutzer Billing ist","Nur nach dem Löschen der Rolle"],["Yes, within the same organization","No, only in the workspace where it was created","Only if the user is billing","Only after the role is deleted"]],
     e:["Custom Roles sind organisationsweit angelegt und in allen Workspaces der Organisation wiederverwendbar.","Custom roles are created organization-wide and reusable in all workspaces of the organization."],
     p:["Eine Rolle, viele Workspaces.","One role, many workspaces."]}]},

 { t:["Rechte auf App, Tabelle und Feld","Permissions on app, table and field"],
   ben:["Du steuerst Zugriff auf drei Ebenen und liest die Tabellenbedingungen richtig.","You control access at three levels and read the table conditions correctly."],
   l:[["Rollen allein regeln noch nicht, wer was in einer App sieht. Das legst du im Builder mode auf drei Ebenen fest: App, Tabelle und Feld.",
       "H:Die drei Ebenen",
       "App: In den App settings steht unter „Allow access to“, welche Rollen die App nutzen dürfen. Tabelle: Für jede Aktion gibt es eine Bedingung: „Can read record if“, „Can edit record if“, „Can create record if“ und „Can delete record if“. Feld: Du legst fest, welche Rollen ein Feld lesen dürfen, zum Beispiel E-Mail-Adressen oder Telefonnummern.",
       "H:So wirken die Bedingungen",
       "Eine Aktion ist nur erlaubt, wenn ihre Bedingung true ergibt. Die Logik trägst du im Feld mit dem Code-Symbol ein. Workspace-Admins bleiben davon unberührt, sie behalten immer Vollzugriff."],
      ["Roles alone do not yet decide who sees what in an app. You set this in builder mode at three levels: app, table and field.",
       "H:The three levels",
       "App: in the app settings, “Allow access to” shows which roles may use the app. Table: every action has a condition: “Can read record if”, “Can edit record if”, “Can create record if” and “Can delete record if”. Field: you decide which roles may read a field, for example email addresses or phone numbers.",
       "H:How the conditions work",
       "An action is only allowed if its condition evaluates to true. You enter the logic in the field with the code symbol. Workspace admins are not affected, they always keep full access."]],
   q:[
    {q:["Wo beschränkst du eine App auf bestimmte Rollen?","Where do you restrict an app to certain roles?"],
     a:[["In den App settings unter Allow access to","In der Billing-Verwaltung der Organisation","In der Formel eines einzelnen Feldes","In der Liste der API-Schlüssel"],["In the app settings under Allow access to","In the billing administration of the organization","In the formula of a single field","In the list of API keys"]],
     e:["Die Einschränkung auf Rollen steht in den App settings unter „Allow access to“.","The restriction to roles is in the app settings under “Allow access to”."],
     p:["App-Ebene: wer darf überhaupt hinein.","App level: who may enter at all."]},
    {q:["Wie viele Bedingungen hat eine Tabelle für Datensatzrechte?","How many conditions does a table have for record permissions?"],
     a:[["Vier: lesen, bearbeiten, anlegen und löschen","Eine einzige Bedingung für alle Aktionen","Zwei Bedingungen: nur lesen und schreiben","Zehn Bedingungen: eine für jedes Feld"],["Four: read, edit, create and delete","A single condition for all actions","Two conditions: only read and write","Ten conditions: one for each field"]],
     e:["Es gibt vier Bedingungen: Can read, Can edit, Can create und Can delete record if.","There are four conditions: Can read, Can edit, Can create and Can delete record if."],
     p:["Lesen, Bearbeiten, Anlegen, Löschen: L-B-A-L.","Read, edit, create, delete."]},
    {q:["Wann ist eine Aktion auf einem Datensatz erlaubt?","When is an action on a record allowed?"],
     a:[["Wenn die Bedingung true ergibt","Wenn die Bedingung false ergibt","Immer, wenn der Benutzer Editor ist","Nur außerhalb des Builder mode"],["When the condition evaluates to true","When the condition evaluates to false","Always when the user is an editor","Only outside builder mode"]],
     e:["Die Aktion ist nur erlaubt, wenn die Bedingung true ergibt.","The action is only allowed if the condition evaluates to true."],
     p:["true = erlaubt, false = nicht erlaubt.","true = allowed, false = not allowed."]},
    {q:["Was steuert die Feld-Ebene?","What does the field level control?"],
     a:[["Welche Rollen ein Feld lesen dürfen","Wer Benutzer in die Organisation einlädt","Wer den Workspace löschen darf","Wie viele Datensätze es gibt"],["Which roles may read a field","Who invites users to the organization","Who may delete the workspace","How many records there are"]],
     e:["Auf Feld-Ebene legst du fest, welche Rollen ein Feld lesen dürfen.","At field level you decide which roles may read a field."],
     p:["Feldrecht = Sichtbarkeit sensibler Angaben.","Field permission = visibility of sensitive data."]}],
   dd:{de:{dd:1,q:"Ordne zu: Wo stellst du das ein?",slots:["Eine App auf Rollen beschränken (Allow access to)","Festlegen, wann ein Datensatz bearbeitet werden darf","Festlegen, wann ein Datensatz gelöscht werden darf","Festlegen, welche Rollen ein einzelnes Feld lesen dürfen"],items:["App-Ebene","Tabelle: Can edit record if","Tabelle: Can delete record if","Feld-Ebene"],e:"Allow access to gehört zur App, Bearbeiten und Löschen sind Tabellenbedingungen, das Lesen einzelner Felder regelst du auf Feld-Ebene."},
       en:{dd:1,q:"Match them: where do you set this?",slots:["Restrict an app to roles (Allow access to)","Decide when a record may be edited","Decide when a record may be deleted","Decide which roles may read a single field"],items:["App level","Table: Can edit record if","Table: Can delete record if","Field level"],e:"Allow access to belongs to the app, editing and deleting are table conditions, reading single fields is set at field level."}}},

 { t:["Benutzer einladen und verwalten","Inviting and managing users"],
   ben:["Du lädst Benutzer richtig ein und kennst die Folgen von Rollenänderung und Entfernen.","You invite users correctly and know the consequences of role changes and removal."],
   l:[["Benutzer lädst du über Einstellungen (Zahnrad) → Users & roles → + Invite users ein. Das geht auf Organisationsebene und für einen Workspace.",
       "H:Einladen",
       "Organisation: E-Mail-Adresse, Organisationsrolle und Sprache der Einladungs-E-Mail. Workspace: E-Mail-Adresse, Standardrolle (None, Admin, Editor oder Viewer), optional Custom Roles und die Sprache. Ist die Person noch nicht in der Organisation, wird sie automatisch als Member hinzugefügt.",
       "H:Danach",
       "Die Einladung bleibt offen, bis sie angenommen wird. Rollenänderungen greifen bei aktiven Benutzern sofort, bei eingeladenen erst nach der Annahme. Entfernst du einen Benutzer auf Organisationsebene, verliert er den Zugriff auf alle Workspaces der Organisation. Entfernst du einen eingeladenen Benutzer, wird die Einladung storniert.",
       "FOLD:Gut zu wissen|Menünamen","Die Dokumentation nennt den Menüpunkt im Workspace an einer Stelle „Users & roles“ und an einer anderen „Workspace users“. Achte auf die Beschriftung in deiner Oberfläche.","ENDFOLD"],
      ["You invite users via settings (gear) → Users & roles → + Invite users. This works at organization level and for a workspace.",
       "H:Inviting",
       "Organization: email address, organization role and the language of the invitation email. Workspace: email address, default role (None, Admin, Editor or Viewer), optionally custom roles and the language. If the person is not yet in the organization, they are added automatically as a member.",
       "H:Afterwards",
       "The invitation stays open until it is accepted. Role changes take effect immediately for active users, for invited users only after acceptance. If you remove a user at organization level, they lose access to all workspaces of the organization. If you remove an invited user, the invitation is cancelled.",
       "FOLD:Good to know|Menu names","The documentation calls the menu item in the workspace “Users & roles” in one place and “Workspace users” in another. Pay attention to the label in your interface.","ENDFOLD"]],
   q:[
    {q:["Wer wird bei einer Workspace-Einladung automatisch Member der Organisation?","Who automatically becomes a member of the organization with a workspace invitation?"],
     a:[["Eine Person, die noch nicht in der Organisation ist","Jeder bestehende Admin der Organisation","Niemand, das passiert nie","Nur Benutzer mit der Rolle Billing"],["A person who is not yet in the organization","Every existing admin of the organization","Nobody, that never happens","Only users with the billing role"]],
     e:["Ist die Person noch nicht in der Organisation, wird sie automatisch als Member hinzugefügt.","If the person is not yet in the organization, they are added automatically as a member."],
     p:["Einladen in den Workspace öffnet die Tür zur Organisation.","Inviting to the workspace opens the door to the organization."]},
    {q:["Was passiert, wenn du einen Benutzer auf Organisationsebene entfernst?","What happens if you remove a user at organization level?"],
     a:[["Er verliert den Zugriff auf alle Workspaces der Organisation","Er verliert nur den Zugriff auf eine einzelne App","Er wird automatisch zum Viewer","Er behält alle seine bisherigen Rechte"],["They lose access to all workspaces of the organization","They only lose access to a single app","They automatically become a viewer","They keep all their previous permissions"]],
     e:["Das Entfernen auf Organisationsebene entzieht den Zugriff auf alle Workspaces der Organisation.","Removing at organization level withdraws access to all workspaces of the organization."],
     p:["Nur für einen Workspace: dessen Berechtigung anpassen.","For one workspace only: adjust its permission."]},
    {q:["Wann greift eine Rollenänderung bei einem eingeladenen Benutzer?","When does a role change take effect for an invited user?"],
     a:[["Erst nach der Annahme der Einladung","Schon vor der Annahme der Einladung","Nur nach einem Neustart des Servers","Nur wenn ein Admin zusätzlich zustimmt"],["Only after the invitation is accepted","Even before the invitation is accepted","Only after a server restart","Only if an admin additionally agrees"]],
     e:["Bei eingeladenen Benutzern greifen Rollenänderungen erst nach der Annahme, bei aktiven sofort.","For invited users role changes take effect after acceptance, for active users immediately."],
     p:["Aktiv: sofort. Eingeladen: nach Annahme.","Active: immediately. Invited: after acceptance."]},
    {q:["Was wählst du beim Einladen in einen Workspace aus?","What do you choose when inviting to a workspace?"],
     a:[["Eine Standardrolle und optional Custom Roles","Nur ein Passwort für den neuen Benutzer","Nur die App, die er sehen soll","Nur die Farbe der Oberfläche"],["A default role and optionally custom roles","Only a password for the new user","Only the app they should see","Only the colour of the interface"]],
     e:["Du wählst eine Standardrolle (None, Admin, Editor, Viewer), optional Custom Roles und die Sprache der Einladungs-E-Mail.","You choose a default role (None, Admin, Editor, Viewer), optionally custom roles and the language of the invitation email."],
     p:["Zuerst Standardrolle, dann nur bei Bedarf Custom Roles.","First the default role, custom roles only if needed."]}]},

 { t:["Rollen in Ninox Script","Roles in Ninox Script"],
   ben:["Du fragst Benutzer und Rollen im Script ab und wählst die passende Funktion.","You query users and roles in script and choose the right function."],
   l:[["Im Script kannst du Benutzer und Rollen abfragen. Dafür gibt es eigene Funktionen.",
       "H:Die wichtigsten Funktionen",
       "userRole() liefert die erste Rolle des Benutzers, zum Beispiel admin oder editor. userRoles() liefert alle Rollennamen als Liste. userHasRole(\"Manager\") prüft, ob der Benutzer diese Rolle hat, und liefert true oder false. userIsAdmin() prüft, ob er Admin ist (true oder false).",
       "H:Beispiele aus der Doku",
       "if userHasRole(\"Manager\") then \"OK\" else \"No access\" end. Und: if not userIsAdmin() then alert(\"Admins only.\") else openPage(\"Admin\") end.",
       "FOLD:Für Profis|Weitere Funktionen und ein Hinweis","Außerdem gibt es unter anderem user(), users(), userId(), userName(), userEmail(), userFirstName(), userLastName(), userFullName() und isAdminMode(). Wie Skripte und Rechte zusammenspielen, beschreibt die Doku nicht. Empfehlung dieser App, nicht der Doku: Rechte zuerst im Rechtemodell (Lektion 5) setzen und Rollenabfragen im Script nur ergänzend nutzen.","ENDFOLD"],
      ["In script you can query users and roles. There are dedicated functions for this.",
       "H:The most important functions",
       "userRole() returns the first role of the user, for example admin or editor. userRoles() returns all role names as a list. userHasRole(\"Manager\") checks whether the user has this role and returns true or false. userIsAdmin() checks whether they are admin (true or false).",
       "H:Examples from the docs",
       "if userHasRole(\"Manager\") then \"OK\" else \"No access\" end. And: if not userIsAdmin() then alert(\"Admins only.\") else openPage(\"Admin\") end.",
       "FOLD:For professionals|More functions and a note","There are also user(), users(), userId(), userName(), userEmail(), userFirstName(), userLastName(), userFullName() and isAdminMode(), among others. How scripts and permissions interact is not described in the docs. Recommendation of this app, not of the docs: set permissions in the permission model first (lesson 5) and use role queries in script only as a complement.","ENDFOLD"]],
   q:[
    {q:["Welche Funktion prüft, ob der Benutzer eine bestimmte Rolle hat?","Which function checks whether the user has a certain role?"],
     a:[["userHasRole(\"Manager\")","userRoleCheck(\"Manager\")","hasRole(\"Manager\")","roleOf(user(), \"Manager\")"],["userHasRole(\"Manager\")","userRoleCheck(\"Manager\")","hasRole(\"Manager\")","roleOf(user(), \"Manager\")"]],
     e:["userHasRole(\"Manager\") liefert true oder false.","userHasRole(\"Manager\") returns true or false."],
     p:["has = hat: userHasRole = hat der Benutzer die Rolle?","has: userHasRole = does the user have the role?"]},
    {q:["Was liefert userIsAdmin()?","What does userIsAdmin() return?"],
     a:[["Einen Wahrheitswert: true oder false","Eine Liste aller Admins des Workspaces","Den Namen des Admins als Text","Die Anzahl der Admins als Zahl"],["A truth value: true or false","A list of all admins of the workspace","The name of the admin as text","The number of admins as a number"]],
     e:["userIsAdmin() ist eine Prüfung und liefert true oder false.","userIsAdmin() is a check and returns true or false."],
     p:["is-Funktionen liefern Ja oder Nein.","is-functions return yes or no."]},
    {q:["Welche Funktion liefert alle Rollennamen des Benutzers als Liste?","Which function returns all role names of the user as a list?"],
     a:[["userRoles()","userRole()","users()","userName()"],["userRoles()","userRole()","users()","userName()"]],
     e:["userRoles() liefert alle Rollennamen als Liste, userRole() nur die erste Rolle.","userRoles() returns all role names as a list, userRole() only the first role."],
     p:["Mehrzahl = Liste: userRoles.","Plural = list: userRoles."]},
    {q:["Was gibt userRole() zurück?","What does userRole() return?"],
     a:[["Die erste Rolle des Benutzers, zum Beispiel admin oder editor","Alle Rollen des Benutzers als Liste von Namen","Nur true oder false als Wahrheitswert","Die E-Mail-Adresse des Benutzers als Text"],["The first role of the user, for example admin or editor","All roles of the user as a list of names","Only true or false as a truth value","The email address of the user as text"]],
     e:["userRole() liefert die erste Rolle des Benutzers, etwa admin oder editor.","userRole() returns the first role of the user, such as admin or editor."],
     p:["Einzahl = eine Rolle: userRole.","Singular = one role: userRole."]}],
   dd:{de:{dd:1,q:"Ordne zu: Welche Funktion passt?",slots:["Alle Rollennamen als Liste","Die erste Rolle des Benutzers","Prüft eine bestimmte Rolle (true oder false)","Prüft, ob der Benutzer Admin ist (true oder false)"],items:["userRoles()","userRole()","userHasRole()","userIsAdmin()"],e:"userRoles() liefert eine Liste, userRole() die erste Rolle, userHasRole() prüft eine Rolle, userIsAdmin() prüft auf Admin."},
       en:{dd:1,q:"Match them: which function fits?",slots:["All role names as a list","The first role of the user","Checks a specific role (true or false)","Checks whether the user is admin (true or false)"],items:["userRoles()","userRole()","userHasRole()","userIsAdmin()"],e:"userRoles() returns a list, userRole() the first role, userHasRole() checks a role, userIsAdmin() checks for admin."}}},

 { t:["Profi: API-Schlüssel und sicher arbeiten","Professional: API keys and working safely"],
   ben:["Du gehst mit API-Schlüsseln und Rechten sicher um.","You handle API keys and permissions safely."],
   l:[["Die Public API von Ninox 4 nutzt einen Workspace-API-Schlüssel (Workspace API key). Du sendest ihn als Bearer-Token im Header „Authorization“. Jeder Schlüssel gehört zu einem Workspace und gewährt nur Zugriff auf dessen Daten.",
       "H:Schlüssel verwalten",
       "Du legst Schlüssel an unter Einstellungen → Workspace → API & integrations → Create API key (Name, optional Ablaufdatum). Die Liste zeigt je Schlüssel unter anderem Ablauf, Ersteller und Erstellungsdatum. Die Doku empfiehlt: einen Schlüssel pro Integration, die Liste regelmäßig prüfen und Schlüssel widerrufen, wenn eine Integration endet oder nicht mehr vertrauenswürdig ist.",
       "H:Sicher arbeiten",
       "Fange bei den Rechten mit einer Standardrolle an und nutze Custom Roles nur bei Bedarf. Ninox-Sicherheitsregel: Zugangsdaten, Schlüssel und Tokens gehören nie in Chats, Skripte, Tickets oder Dokumente. Nutze Platzhalter wie <API_KEY> und lege Geheimnisse nur im Passwortmanager (Bitwarden) oder im Schlüsselbund des Systems ab. Wurde ein Schlüssel geteilt, gilt er als kompromittiert: widerrufen und melden."],
      ["The Ninox 4 public API uses a workspace API key. You send it as a bearer token in the “Authorization” header. Every key belongs to one workspace and only grants access to its data.",
       "H:Managing keys",
       "You create keys under settings → workspace → API & integrations → Create API key (name, optional expiry date). The list shows, among other things, expiry, creator and creation date for each key. The docs recommend: one key per integration, review the list regularly and revoke keys when an integration ends or is no longer trusted.",
       "H:Working safely",
       "Start with a default role for permissions and use custom roles only when needed. Ninox security rule: credentials, keys and tokens never belong in chats, scripts, tickets or documents. Use placeholders such as <API_KEY> and keep secrets only in the password manager (Bitwarden) or the system keychain. If a key was shared, treat it as compromised: revoke it and report it."]],
   q:[
    {q:["Wie authentifiziert sich die Public API von Ninox 4?","How does the Ninox 4 public API authenticate?"],
     a:[["Mit einem Workspace-API-Schlüssel als Bearer-Token","Mit dem Passwort des Admins direkt im Link","Ganz ohne Anmeldung für jeden Aufrufer","Mit der E-Mail-Adresse des Benutzers allein"],["With a workspace API key as a bearer token","With the admin's password directly in the link","Without any login for every caller","With the user's email address alone"]],
     e:["Der Workspace-API-Schlüssel wird als Bearer-Token im Header Authorization gesendet.","The workspace API key is sent as a bearer token in the Authorization header."],
     p:["Ein Schlüssel gehört zu genau einem Workspace.","One key belongs to exactly one workspace."]},
    {q:["Wo dürfen API-Schlüssel nicht stehen?","Where must API keys not be?"],
     a:[["In Chats, Skripten, Tickets und Dokumenten","In einem Passwortmanager","Im Schlüsselbund des Systems","Als Platzhalter wie <API_KEY> in Beispielen"],["In chats, scripts, tickets and documents","In a password manager","In the system keychain","As a placeholder such as <API_KEY> in examples"]],
     e:["Schlüssel gehören nie in Chats, Skripte, Tickets oder Dokumente. Das ist eine Ninox-Sicherheitsregel.","Keys never belong in chats, scripts, tickets or documents. This is a Ninox security rule."],
     p:["Dies ist eine Ninox-Regel (ISMS), keine Doku-Aussage; die Doku zeigt, wo Schlüssel verwaltet werden.","This is a Ninox rule (ISMS), not a docs statement; the docs show where keys are managed."]},
    {q:["Für welche Daten gilt ein Workspace-API-Schlüssel?","For which data does a workspace API key apply?"],
     a:[["Nur für die Daten dieses Workspaces","Für alle Workspaces der Organisation","Für alle Organisationen von Ninox","Nur für die Rechnungen der Organisation"],["Only for the data of this workspace","For all workspaces of the organization","For all organizations at Ninox","Only for the invoices of the organization"]],
     e:["Jeder Schlüssel gehört zu einem Workspace und gewährt nur Zugriff auf dessen Daten.","Every key belongs to a workspace and only grants access to its data."],
     p:["Schlüssel = Schlüssel für eine Tür, nicht für das ganze Haus.","Key = key to one door, not to the whole house."]},
    {q:["Was empfiehlt die Doku zu API-Schlüsseln?","What do the docs recommend for API keys?"],

function certRender(){ $("cprev").innerHTML = certSvg(["100%", "auto"]); }
function certCanvas(cb){
  const img = new Image();
  img.onload = () => { const cv = document.createElement("canvas"); cv.width = 2480; cv.height = 1754; const x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 2480, 1754); x.drawImage(img, 0, 0, 2480, 1754); cb(cv); };
  img.onerror = () => { $("cmsg").textContent = "Fehler / Error"; $("cmsg").classList.remove("hide"); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(certSvg([2480, 1754]));
}
function certFileName(ext){ const n = (certLoad().name || "").trim().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, ""); return t("cFile") + (n ? "-" + n : "") + "." + ext; }
function certSaveBlob(blob, fn){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function certPdfBlob(jpeg, w, h){
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = d => { const b = typeof d === "string" ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(n + " 0 obj\n" + body + "\nendobj\n"); };
  push("%PDF-1.4\n");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  offs[4] = len; push("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + w + " /Height " + h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n"); push(jpeg); push("\nendstream\nendobj\n");
  const cs = "q 841.89 0 0 595.28 0 0 cm /Im0 Do Q";
  obj(5, "<< /Length " + cs.length + " >>\nstream\n" + cs + "\nendstream");
  const xr = len; let x = "xref\n0 6\n0000000000 65535 f \n";
  for(let n = 1; n <= 5; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  push(x + "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xr + "\n%%EOF");
  return new Blob(parts, {type: "application/pdf"});
}
function certDownload(kind){
  if(!(certLoad().name || "").trim()){ $("cmsg").textContent = t("certNeed"); $("cmsg").classList.remove("hide"); $("cname").focus(); return; }
  $("cmsg").classList.add("hide");
  certCanvas(cv => {
    if(kind === "png") cv.toBlob(b => certSaveBlob(b, certFileName("png")), "image/png");
    else { const bin = atob(cv.toDataURL("image/jpeg", 0.93).split(",")[1]), u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); certSaveBlob(certPdfBlob(u, cv.width, cv.height), certFileName("pdf")); }
  });
}
function openCert(){
  if(!allPassed()){ showMap(); return; }
  const c = certLoad(); if(!c.date){ c.date = new Date().toISOString(); certSave(c); }
  $("chomeT").textContent = t("home"); $("ctitle").textContent = t("certT"); $("cintro").textContent = t("certIntro");
  $("cnameL").textContent = t("certName"); $("cname").value = c.name || ""; $("cmsg").classList.add("hide");
  $("cpdf").textContent = t("certPdf"); $("cpng").textContent = t("certPng"); $("cnote").textContent = t("certNote"); $("cback").textContent = t("certBack");
  certRender(); show("cert");
}
