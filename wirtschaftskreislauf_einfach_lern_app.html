<script>
const APP_VERSION = "1.0.0";
const PASS = 3;

// Erste Antwort ist jeweils die richtige, gemischt wird automatisch.
// Inhalte der Lern-App "Wirtschaftskreislauf einfach". Ein Kapitel = ein Eintrag in CH, DE und EN nebeneinander.
// Niveau: leicht (einfache Begriffe, Alltagsbeispiele, klar unterscheidbare Antworten). Stand der Quellen: 13.10.2026.
const CH = [
 { t:["Was ist ein Wirtschaftskreislauf?","What is a circular flow of the economy?"],
   ben:["Du erklärst in einem Satz, was ein Wirtschaftskreislauf zeigt, und kennst die Sektoren.","You explain in one sentence what a circular flow shows and know the sectors."],
   l:[["Ein Wirtschaftskreislauf ist ein einfaches Bild der Wirtschaft. Es zeigt, wie Güter und Geld zwischen den Beteiligten fließen. Die Beteiligten heißen Sektoren.",
       "H:Die Sektoren",
       "Im einfachen Kreislauf gibt es zwei Sektoren: private Haushalte und Unternehmen. Im erweiterten Kreislauf kommen der Staat und das Ausland dazu. Die Banken vermitteln zwischen Sparen und Investieren.",
       "H:Güter und Geld",
       "Güter sind Waren und Dienstleistungen. Geld fließt immer in die Gegenrichtung: Wer ein Gut liefert, bekommt Geld dafür.",
       "FOLD:Andere Wörter in Büchern|Verbraucher, Erweitert, Pole","Im Bildungsplan Baden-Württemberg heißen die Haushalte oft Verbraucher oder Konsumenten. Statt Sektoren sagt man manchmal Pole. Je nach Quelle heißt das Modell mit Staat und Ausland erweitert, vollständig oder offen. Die Banken heißen im Bildungsplan des Wirtschaftsgymnasiums Kapitalsammelstellen; in der kaufmännischen Berufsschule erscheinen sie laut Sekundärquellen als Vermögensänderung. Diese App bleibt bei: private Haushalte, Unternehmen, Staat, Ausland und Banken als Vermittler.","ENDFOLD"],
      ["A circular flow is a simple picture of the economy. It shows how goods and money flow between the participants. The participants are called sectors.",
       "H:The sectors",
       "The simple circular flow has two sectors: private households and firms. The extended circular flow adds the government and foreign countries. Banks mediate between saving and investing.",
       "H:Goods and money",
       "Goods are products and services. Money always flows in the opposite direction: whoever delivers a good receives money for it.",
       "FOLD:Other words in books|Consumer, extended, poles","In the curriculum of Baden-Württemberg households are often called consumers. Instead of sectors people sometimes say poles. Depending on the source the model with government and foreign countries is called extended, complete or open. The banks are called capital collection points in the curriculum of the business-oriented upper school; in the commercial vocational school they appear as change in assets according to secondary sources. This app sticks to: private households, firms, government, foreign countries and banks as mediators.","ENDFOLD"]],
   q:[
    {q:["Was zeigt ein Wirtschaftskreislauf?","What does a circular flow of the economy show?"],
     a:[["Wie Güter und Geld zwischen den Sektoren fließen","Wie hoch der Steuersatz in einem Land ist","Wie viele Menschen in Unternehmen arbeiten","Wie sich Preise an der Börse entwickeln"],["How goods and money flow between the sectors","How high the tax rate in a country is","How many people work in firms","How prices develop on the stock exchange"]],
     e:["Ein Wirtschaftskreislauf zeigt die Güter- und Geldströme zwischen den Sektoren.","A circular flow shows the flows of goods and money between the sectors."],
     p:["Kreislauf: Was einer ausgibt, ist das Einkommen eines anderen.","Circular flow: what one spends is another's income."]},
    {q:["Welche vier Sektoren hat der erweiterte Kreislauf?","Which four sectors does the extended circular flow have?"],
     a:[["Haushalte, Unternehmen, Staat und Ausland","Nur private Haushalte und Unternehmen","Haushalte, Schulen, Vereine und Kirchen","Unternehmen, Börsen, Medien und Parteien"],["Households, firms, government and foreign countries","Only private households and firms","Households, schools, clubs and churches","Firms, stock exchanges, media and parties"]],
     e:["Haushalte, Unternehmen, Staat und Ausland. Banken vermitteln zwischen Sparen und Investieren.","Households, firms, government and foreign countries. Banks mediate between saving and investing."],
     p:["Merke: H-U-S-A (Haushalte, Unternehmen, Staat, Ausland).","Remember: H-F-G-F (households, firms, government, foreign countries)."]},
    {q:["Ein Unternehmen liefert Waren. Was fließt in die Gegenrichtung?","A firm delivers goods. What flows in the opposite direction?"],
     a:[["Geld","Noch mehr Waren","Steuern","Kredite"],["Money","More goods","Taxes","Loans"]],
     e:["Geld. Güterstrom und Geldstrom laufen in entgegengesetzte Richtungen.","Money. The flow of goods and the flow of money run in opposite directions."],
     p:["Ware raus, Geld rein.","Goods out, money in."]},
    {q:["Was ist ein Güterstrom?","What is a flow of goods?"],
     a:[["Der Fluss von Waren und Dienstleistungen","Der Fluss von Zahlungen zwischen Konten","Der Fluss von Steuern an den Staat","Der Fluss von Krediten der Banken"],["The flow of products and services","The flow of payments between accounts","The flow of taxes to the government","The flow of loans from banks"]],
     e:["Ein Güterstrom ist der Fluss von Waren und Dienstleistungen.","A flow of goods is the flow of products and services."],
     p:["Güter = Sachen und Leistungen, Geld = Zahlungen.","Goods = things and services, money = payments."]}]},

 { t:["Haushalte und Unternehmen","Households and firms"],

       "H:Lohn und Konsum",
       "Die Haushalte stellen ihre Arbeit zur Verfügung und bekommen Lohn oder Gehalt. Für Boden gibt es Pacht oder Miete, für Kapital Zinsen. Mit dem Einkommen kaufen die Haushalte Waren. Diese Zahlungen heißen Konsumausgaben.",

      ["Private households are you, your family and everyone who buys goods. Firms produce goods and services. For this they need labour, land and capital. These are the factors of production.",

       "Households provide their labour and receive wages or salary. Land earns rent or lease, capital earns interest. With the income households buy goods. These payments are called consumption expenditure.",

   q:[
    {q:["Was stellen Haushalte den Unternehmen zur Verfügung?","What do households provide to firms?"],
     a:[["Arbeit, Boden und Kapital","Fertige Konsumgüter","Steuern und Abgaben","Kredite und Zinsen"],["Labour, land and capital","Finished consumer goods","Taxes and levies","Loans and interest"]],
     e:["Haushalte liefern Produktionsfaktoren: Arbeit, Boden und Kapital.","Households supply factors of production: labour, land and capital."],

    {q:["Wofür bekommst du als Beschäftigter einen Lohn?","What do you receive a wage for as an employee?"],
     a:[["Für deine Arbeit","Für gekaufte Waren","Für gezahlte Steuern","Für einen Kredit"],["For your work","For purchased goods","For paid taxes","For a loan"]],

     p:["Arbeit rein, Lohn raus.","Work in, wage out."]},
    {q:["Du kaufst im Laden Brot. Wie heißt deine Zahlung?","You buy bread in a shop. What is your payment called?"],
     a:[["Konsumausgabe","Lohn","Steuer","Subvention"],["Consumption expenditure","Wage payment","Income tax","Government subsidy"]],
     e:["Zahlungen der Haushalte für Waren heißen Konsumausgaben.","Payments by households for goods are called consumption expenditure."],
     p:["Konsum = Kaufen für den eigenen Bedarf.","Consumption = buying for your own needs."]},
    {q:["Wer stellt Waren und Dienstleistungen her?","Who produces goods and services?"],

     p:["Unternehmen = Produktion, Haushalte = Konsum.","Firms = production, households = consumption."]}],
   dd:{de:{dd:1,q:"Ordne zu: In welche Richtung läuft der Strom?",slots:["Lohn und Gehalt","Konsumausgaben","Arbeitsleistung","Konsumgüter"],items:["Unternehmen → Haushalte (Geld)","Haushalte → Unternehmen (Geld)","Haushalte → Unternehmen (Leistung)","Unternehmen → Haushalte (Güter)"],e:"Lohn fließt von den Unternehmen zu den Haushalten, die Konsumausgaben zurück. Die Arbeit geht an die Unternehmen, die Konsumgüter an die Haushalte."},
       en:{dd:1,q:"Match them: in which direction does the flow run?",slots:["Wages and salaries","Consumption expenditure","Labour","Consumer goods"],items:["Firms → households (money)","Households → firms (money)","Households → firms (service)","Firms → households (goods)"],e:"Wages flow from firms to households, consumption expenditure flows back. Labour goes to firms, consumer goods go to households."}}},

 { t:["Banken: Sparen und Kredite","Banks: saving and loans"],

       "So kommt gespartes Geld zurück in den Kreislauf."],
      ["Households do not spend all their income. What is left is called saving. The money is kept at a bank.",
       "H:Banks mediate",
       "The bank passes saved money on as a loan, for example to a firm. With it the firm buys machines and equipment. This is called investment.",
       "In this way saved money returns to the circular flow."]],
   q:[

     e:["Sparen ist der Teil des Einkommens, der nicht für Konsum ausgegeben wird.","Saving is the part of income that is not spent on consumption."],
     p:["Einkommen = Konsum + Sparen.","Income = consumption + saving."]},
    {q:["Wohin fließt gespartes Geld im erweiterten Kreislauf?","Where does saved money flow in the extended circular flow?"],
     a:[["Zu den Banken","Direkt zum Staat","Als Lohn zu den Unternehmen","Als Export ins Ausland"],["To the banks","Directly to the government","As wages to firms","As exports abroad"]],
     e:["Gespartes Geld liegt bei den Banken.","Saved money is kept at the banks."],
     p:["Sparen → Bank.","Saving → bank."]},
    {q:["Was machen Banken mit gespartem Geld?","What do banks do with saved money?"],
     a:[["Sie geben es als Kredite weiter","Sie geben es als Steuer an den Staat","Sie kaufen damit Konsumgüter für Haushalte","Sie zahlen es als Lohn an die Haushalte aus"],["They pass it on as loans","They give it to the government as tax","They buy consumer goods for households with it","They pay it out as wages to households"]],
     e:["Banken vermitteln: Sie geben Ersparnisse als Kredite weiter.","Banks mediate: they pass savings on as loans."],
     p:["Bank = Brücke zwischen Sparern und Kreditnehmern.","Bank = bridge between savers and borrowers."]},
    {q:["Was ist eine Investition eines Unternehmens?","What is an investment by a firm?"],

     e:["Investitionen erneuern oder erweitern Maschinen und Anlagen.","Investments renew or expand machines and equipment."],
     p:["Investieren = Produktionsmittel kaufen.","Investing = buying means of production."]}]},

 { t:["Der Staat","The government"],

    {q:["Was sind Subventionen?","What are subsidies?"],

     e:["Subventionen sind finanzielle Hilfen des Staates an Unternehmen.","Subsidies are financial help from the government to firms."],

 { t:["Das Ausland","Foreign countries"],
   ben:["Du erklärst Export und Import und wohin das Geld fließt.","You explain exports and imports and where the money flows."],

function ende(quiet){

}
