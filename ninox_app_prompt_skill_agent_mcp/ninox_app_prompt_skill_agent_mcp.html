<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1f2026;--mute:#4d4f54;--line:#d8d7d1;--brandbg:#e6ecff;--brand:#4970ff;--brand2:#2f52e0;--btn:#2f52e0;--btnh:#2443bd;--badt:#b3262c;--okt:#0b6b4d;--accent:#ff9619;--ok:#14a373;--okbg:#e5f7ef;--bad:#d93a40;--badbg:#fdeded;--hero1:#fff;--hero2:#fff;--code:#f1f0ec}
@media(prefers-color-scheme:dark){:root{--bg:#17181c;--card:#202228;--ink:#f2f1ee;--mute:#b3b5bb;--line:#383a42;--brandbg:#232a4a;--brand:#6f8cff;--brand2:#9fb2ff;--btn:#3f63e8;--btnh:#2f52e0;--badt:#f07a7e;--okt:#3fcf9b;--accent:#ffa940;--ok:#3fcf9b;--okbg:#10352b;--bad:#f07a7e;--badbg:#3a1d20;--hero1:#202228;--hero2:#202228;--code:#1a1b20}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:760px;margin:0 auto;padding:16px 16px 44px}
h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.15;margin:6px 0 10px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;line-height:1.3;margin:0 0 16px;font-weight:700}
p{margin:0 0 14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(11,27,52,.04),0 8px 24px rgba(11,27,52,.05)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:14px 16px;text-align:left;width:100%;margin-bottom:10px;min-height:50px;transition:border-color .15s,background .15s}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button.primary{background:var(--btn);border-color:var(--btn);color:#fff;text-align:center;font-weight:700}
button.primary:hover:not(:disabled){background:var(--btnh)}button.primary:disabled{opacity:.5;cursor:not-allowed}
button.ghost{text-align:center;color:var(--mute);background:transparent}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}.opt:disabled{cursor:default}
.opt{display:flex;align-items:flex-start;gap:12px}.opt::before{flex:none;content:attr(data-k);display:inline-grid;place-items:center;width:28px;height:28px;margin:0;border:1px solid var(--line);border-radius:50%;font-size:.85rem;font-weight:700;color:var(--mute);background:var(--bg)}
.opt.ok::before{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad::before{background:var(--bad);border-color:var(--bad);color:#fff}
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);color:#fff;border-radius:20px;padding:22px 20px 20px;margin-bottom:16px}
.hero p{color:rgba(255,255,255,.84)}.hero h1{color:#fff}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px}
.lang{display:flex;gap:6px;justify-content:flex-end;float:right}
.lang button{width:auto;margin:0;min-height:34px;padding:5px 13px;text-align:center;font-size:.85rem;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.lang button[aria-pressed=true]{background:#fff;color:var(--hero1);border-color:#fff}
.ov{display:flex;align-items:center;gap:12px;margin:14px 0 10px;font-size:.9rem;color:rgba(255,255,255,.85)}
.ovb{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}.ovb i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.rank{display:inline-block;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:3px 12px;font-size:.88rem}
.why{background:rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;margin:14px 0 6px}.why h2{color:#fff;font-size:1.05rem;margin:0 0 6px}.why p{margin:0 0 8px;font-size:.93rem}.why ul{margin:0;padding-left:20px;font-size:.92rem;color:rgba(255,255,255,.9)}.why li{margin-bottom:6px}.why .pt{margin:0 0 12px}.why .pt b{display:block;margin-bottom:4px}.why .pt p{margin:0 0 5px;font-size:.9rem;color:rgba(255,255,255,.92)}.tag{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:1px}.why b{color:#fff}
.hero #note{font-size:.88rem;margin-top:10px;margin-bottom:0}
.sec{margin:22px 4px 10px;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:800}
.sec.pro{color:var(--accent)}.sec.pro::after{content:"PRO";margin-left:10px;font-size:.75rem;background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.05em}
.lv{margin-bottom:8px}.lv button{margin:0;display:flex;gap:14px;align-items:center}.lv button:disabled{opacity:.5;cursor:not-allowed}
.lv button:hover:not(:disabled){border-color:var(--brand)}
.nr{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.lv .done .nr{background:var(--ok);border-color:var(--ok);color:#fff}.lv small{display:block;color:var(--mute);font-size:.82rem}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-bottom:8px;font-weight:600}
.bar{display:flex;gap:4px;margin:0 0 20px}.seg{flex:1;height:8px;border-radius:4px;background:var(--line)}
.seg.ok{background:var(--ok)}.seg.bad{background:var(--bad)}.seg.cur{background:var(--brand)}.seg.now{outline:2px solid var(--brand);outline-offset:1px}
.fb{margin:8px 0 14px;padding:13px 15px;border-radius:12px;background:var(--bg);border-left:4px solid var(--brand);font-size:.95rem}
.score{font-size:3.2rem;font-weight:800;line-height:1;margin:6px 0 4px;letter-spacing:-.02em}
.lesson{background:var(--bg);border-radius:12px;padding:16px 18px;margin-bottom:16px}.lesson p{color:var(--ink);margin:0 0 10px}.lesson p:last-child{margin:0}
.lesson pre{margin:0 0 10px;padding:12px 14px;background:var(--code);border:1px solid var(--line);border-radius:10px;font:.84rem/1.55 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;color:var(--ink)}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:.95rem}.rev b{display:block}.rev span{color:var(--mute)}
.hint{font-size:.8rem;text-align:center;margin:4px 0 0}
.ex{text-align:center;font-weight:700;color:var(--brand);border:2px solid var(--brand);background:var(--card)}.ex:hover{background:var(--bg)}
.exbox{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.exh{padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--line);font:600 .82rem/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}
.exh::before{content:"● ● ●";letter-spacing:2px;margin-right:12px;color:var(--line)}
.exc{padding:6px 14px 12px}
.plabel{font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--brand2);margin:12px 0 5px}
.code{margin:0 0 4px;padding:11px 13px;background:var(--code);border:1px solid var(--line);border-radius:8px;font:.83rem/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.code.fm{border-left:4px solid var(--brand)}.code.bd{border-left:4px solid var(--accent)}
.code .pr{color:var(--accent);font-weight:700}.code .k{color:var(--brand);font-weight:700}.code .hd{font-weight:700}.code .who{font-weight:700;color:var(--brand)}
.code .okc{color:var(--ok);font-weight:700}.code .badc{color:var(--bad);font-weight:700}
.exn{margin:0;padding:11px 14px;border-top:1px solid var(--line);font-size:.9rem;color:var(--ink);background:var(--bg)}.exn::before{content:attr(data-l) " · ";font-weight:700;color:var(--brand)}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px dashed var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;min-height:56px}
.slot .sl{flex:1 1 150px;font-size:.92rem;color:var(--mute)}.slot .drop{flex:1 1 150px;min-height:38px;display:flex}
.slot.over{border-color:var(--brand);background:var(--bg)}.slot.ok{border:2px solid var(--ok);background:var(--okbg)}.slot.bad{border:2px solid var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:52px;padding:8px;border:1px dashed var(--line);border-radius:12px}
.chip{width:auto;margin:0;min-height:40px;padding:8px 12px;border-radius:10px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-size:.9rem;background:var(--card)}
.chip.sel{outline:3px solid var(--brand)}.chip:disabled{cursor:default;color:var(--ink)}
.chip.dragging{position:fixed;z-index:20;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.28);opacity:.95}
.src{margin:0 0 16px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:.9rem}.src h3{margin:0 0 6px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.src h4{margin:10px 0 4px;font-size:.9rem}.src ul{margin:0;padding-left:20px}.src li{margin:2px 0}.src a,.useful a{color:var(--brand);font-weight:600;overflow-wrap:anywhere}.useful{margin:18px 0 8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.useful h2{margin:0 0 4px;font-size:1rem}.useful p{margin:6px 0 0;font-size:.82rem;color:var(--mute)}.useful ul{margin:0;padding:0;list-style:none;font-size:.9rem}.useful li{margin:0;padding:8px 0;border-top:1px solid var(--line)}.useful li:first-child{border-top:0}.useful li small{display:block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.useful li span{display:block;color:var(--mute);font-size:.82rem;line-height:1.35}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-6px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}.navb{display:inline-flex;align-items:center;gap:6px;width:auto;margin:0;min-height:40px;padding:6px 12px 6px 8px;border-radius:10px;font-size:.9rem;font-weight:600;color:var(--brand);background:transparent;border-color:transparent;flex:none}.navb:hover{background:var(--bg);border-color:var(--line)}.navl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem;font-weight:600;color:var(--mute)}
.exu{margin:0;padding:10px 14px;border-top:1px solid var(--line);font-size:.88rem;background:var(--card)}.exu a{color:var(--brand);font-weight:600}
footer{text-align:center;font-size:.8rem;color:var(--mute);margin-top:22px}
.hide{display:none}

.hero{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:24px 20px 20px}
.hero h1{color:var(--ink);font-size:clamp(1.8rem,6vw,2.5rem);margin:14px 0 8px}
.hero p{color:var(--mute)}
.eyebrow{background:var(--brandbg);color:var(--brand)}
.lang button{color:var(--mute);border-color:var(--line)}
.lang button[aria-pressed=true]{background:var(--btn);color:#fff;border-color:var(--btn)}
.ov{color:var(--mute)}.ovb{background:var(--line)}
.rank{border-color:var(--line);color:var(--ink);background:transparent}
.why{background:transparent;border-radius:0;padding:0;margin:18px 0 8px}
.why .pt{margin:0 0 14px;padding:2px 0 2px 14px;border-left:3px solid var(--brand)}
.why .pt b{display:block;margin:0 0 2px;color:var(--ink);font-size:1.02rem}
.why .pt p{margin:0;font-size:.95rem;color:var(--mute)}
.lv button small:empty{display:none}
.card{box-shadow:none}
.sec{color:var(--mute);font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
/* 3.6.0 Motivation: Nutzen vorn, Als-Nächstes, Feiern */
.hero #cta{margin:10px 0 6px;min-height:54px;font-size:1.05rem;border-radius:14px}
.lv button.next{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.badge{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;background:var(--btn);color:#fff;font-size:.75rem;font-style:normal;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:2px}
.gain{margin:-4px 0 16px;padding:12px 14px;border-radius:12px;background:var(--brandbg);color:var(--ink)}
.gain b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brand2);margin-bottom:2px}
.gain span{display:block;font-weight:600}
.gain small{display:block;margin-top:6px;color:var(--mute);font-size:.82rem}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.score.pass{animation:pop .5s ease-out;color:var(--ok)}
@media(prefers-reduced-motion:reduce){.confetti{display:none}.score.pass{animation:none}}

.vs{display:grid;gap:10px;margin:6px 0 10px}
@media(min-width:560px){.vs{grid-template-columns:1fr 1fr}}
.vsr{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.vsr b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.vsr span{font-size:.92rem;color:var(--ink)}
.vsr.no b{color:var(--badt)}
.vsr.yes{border-color:var(--ok);background:var(--okbg)}.vsr.yes b{color:var(--okt)}
/* 3.10.0 Grafiken im Start-Kapitel */
.gfx{margin:14px 0}
.gh{margin:26px 0 8px;font-size:1.08rem;color:var(--ink)}
.leg{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.leg i{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--btn);color:#fff;font-style:normal;font-size:.8rem;font-weight:700}
.leg b{display:block;margin:0 0 2px;color:var(--ink);font-size:.98rem}.leg span{display:block;color:var(--mute);font-size:.93rem;line-height:1.4}
.gfx svg{width:100%;height:auto;display:block;max-width:460px;margin:0 auto}

<script>
const APP_VERSION = "1.2.1"; const HOME_URL = "../dashboard/dashboard.html", HOME_NAME = "Ninox University";
const PASS = 3;

// Erste Antwort ist jeweils die richtige, gemischt wird automatisch.
// Inhalte der Lern-App "Prompt, Skill, MCP, Loop und Agent". Ein Kapitel = ein Eintrag in CH, DE und EN nebeneinander.
// Niveau: ansteigend (Lektion 1 bis 3 einfach mit Beispielen, 4 bis 6 mittel, 7 bis 9 Profi). Stand der Quellen: 13.10.2026.
const CH = [
 { t:["Der Prompt: deine Anweisung","The prompt: your instruction"],
   ben:["Du schreibst Prompts, die klar sind und zum gewünschten Ergebnis führen.","You write prompts that are clear and lead to the result you want."],
   l:[["Ein Prompt ist die Anweisung oder Eingabe, die du der KI gibst. Alles Weitere in dieser App baut darauf auf.",
       "H:Beispiel: schlecht und gut",
       "Schlecht: „Mach was mit der E-Mail.“ Gut: „Fasse diese E-Mail in drei Sätzen zusammen. Ton: freundlich.“ Der gute Prompt sagt, was getan werden soll, wie lang es sein soll und in welchem Ton.",
       "H:Was einen Prompt besser macht",
       "Laut Anthropic helfen vor allem: klar und direkt sein, Kontext geben, Beispiele zeigen (drei bis fünf sind ein guter Richtwert), den Prompt mit Tags wie XML strukturieren und der KI eine Rolle geben. Die einfache Probe: Zeige den Prompt einem Kollegen mit wenig Kontext. Wäre er verwirrt, wäre es die KI auch.",
       "FOLD:Für Profis|Aufbau eines guten Prompts","Rolle (wer bist du), Aufgabe (was sollst du tun), Kontext (wozu und für wen), Format (wie soll das Ergebnis aussehen), Beispiele (so soll es aussehen). Eine Rolle setzt du am besten im System-Prompt.","ENDFOLD"],
      ["A prompt is the instruction or input you give the AI. Everything else in this app builds on it.",
       "H:Example: bad and good",
       "Bad: “Do something with the email.” Good: “Summarise this email in three sentences. Tone: friendly.” The good prompt says what to do, how long it should be and in which tone.",
       "H:What makes a prompt better",
       "According to Anthropic the main helpers are: be clear and direct, give context, show examples (three to five are a good rule of thumb), structure the prompt with tags such as XML and give the AI a role. The simple test: show the prompt to a colleague with little context. If they would be confused, the AI would be too.",
       "FOLD:For professionals|Structure of a good prompt","Role (who are you), task (what should you do), context (what for and for whom), format (what should the result look like), examples (it should look like this). You best set a role in the system prompt.","ENDFOLD"]],
   q:[
    {q:["Was ist ein Prompt?","What is a prompt?"],
     a:[["Die Anweisung oder Eingabe an die KI","Ein Programm, das die KI trainiert","Ein Passwort für die KI","Eine Datei mit Zugangsdaten"],["The instruction or input to the AI","A program that trains the AI","A password for the AI","A file with credentials"]],
     e:["Ein Prompt ist die Eingabe, mit der du der KI sagst, was sie tun soll.","A prompt is the input with which you tell the AI what to do."],
     p:["Prompt = deine Aufgabe in Worten.","Prompt = your task in words."]},
    {q:["Welcher Prompt ist besser?","Which prompt is better?"],
     a:[["Fasse diese E-Mail in drei Sätzen zusammen. Ton: freundlich.","Mach bitte irgendetwas Sinnvolles mit dieser E-Mail.","Schreib etwas zu dieser E-Mail, du weißt schon, was ich meine.","Zusammenfassung, aber nicht zu lang und nicht zu kurz."],["Summarise this email in three sentences. Tone: friendly.","Please do something sensible with this email.","Write something about this email, you know what I mean.","Summary, but not too long and not too short."]],
     e:["Der erste Prompt sagt klar, was, wie lang und in welchem Ton.","The first prompt says clearly what, how long and in which tone."],
     p:["Klar und direkt schlägt vage und kurz.","Clear and direct beats vague and short."]},
    {q:["Was verbessert einen Prompt?","What improves a prompt?"],
     a:[["Das gewünschte Format nennen","Alles in Großbuchstaben schreiben","Möglichst wenig Kontext geben","Die Frage mehrmals wiederholen"],["Naming the desired format","Writing everything in capital letters","Giving as little context as possible","Repeating the question several times"]],
     e:["Format, Kontext, Beispiele und Klarheit helfen, Großbuchstaben oder Wiederholung nicht.","Format, context, examples and clarity help, capital letters or repetition do not."],
     p:["Sage, wie das Ergebnis aussehen soll: Liste, Tabelle, drei Sätze.","Say what the result should look like: list, table, three sentences."]},
    {q:["Wozu dienen Beispiele im Prompt?","What are examples in a prompt for?"],
     a:[["Sie zeigen der KI, wie das gewünschte Ergebnis aussieht","Sie machen die Antwort automatisch kürzer","Sie schalten Werkzeuge der KI frei","Sie speichern den Prompt dauerhaft"],["They show the AI what the desired result looks like","They automatically make the answer shorter","They unlock tools of the AI","They store the prompt permanently"]],
     e:["Beispiele (Few-Shot) zeigen Stil und Format. Drei bis fünf sind ein guter Richtwert.","Examples (few-shot) show style and format. Three to five are a good rule of thumb."],
     p:["Zeige, was du willst, statt nur zu beschreiben.","Show what you want instead of only describing it."]}]},

 { t:["Kontext: das Arbeitsgedächtnis","Context: the working memory"],
   ben:["Du erklärst, was die KI „sehen“ kann und warum mehr Text nicht immer besser ist.","You explain what the AI can see and why more text is not always better."],
   l:[["Die KI kennt nur das, was in ihrem Kontextfenster steht. Das Kontextfenster ist alles, worauf sie beim Antworten zugreifen kann: dein Prompt, das bisherige Gespräch, Dokumente, Ergebnisse von Werkzeugen und ihre eigene Antwort.",
       "H:Beispiel",
       "Du fragst: „Wie hoch ist unser Rabatt?“ Ohne die Preisliste im Kontext kann die KI nur raten. Mit der Preisliste im Prompt antwortet sie genau.",
       "H:Mehr ist nicht immer besser",
       "Wird der Kontext sehr lang, können Genauigkeit und Erinnerung nachlassen. Wichtiges gehört deshalb klar in den Prompt. Bei langen Gesprächen kann der Verlauf zusammengefasst werden (Kompression)."],
      ["The AI only knows what is in its context window. The context window is everything it can refer to when answering: your prompt, the conversation so far, documents, results of tools and its own answer.",
       "H:Example",
       "You ask: “What is our discount?” Without the price list in the context the AI can only guess. With the price list in the prompt it answers exactly.",
       "H:More is not always better",
       "When the context gets very long, accuracy and recall can degrade. Important things therefore belong clearly in the prompt. In long conversations the history can be summarised (compaction)."]],
   q:[
    {q:["Was ist das Kontextfenster?","What is the context window?"],
     a:[["Alles, worauf die KI beim Antworten zugreifen kann","Das Fenster der App auf dem Bildschirm","Die Zeit, die eine Antwort dauert","Die Liste aller trainierten Daten"],["Everything the AI can refer to when answering","The window of the app on the screen","The time an answer takes","The list of all training data"]],
     e:["Das Kontextfenster ist das Arbeitsgedächtnis: alles, worauf die KI beim Antworten zugreifen kann.","The context window is the working memory: everything the AI can refer to when answering."],
     p:["Kontext = Arbeitsgedächtnis der KI.","Context = the AI's working memory."]},
    {q:["Was zählt zum Kontext?","What counts as context?"],
     a:[["Prompt, Gespräch, Dokumente und Tool-Ergebnisse","Nur der letzte Satz, den du geschrieben hast","Nur Bilder und Fotos aus dem Gespräch","Nur Dateien, die auf deinem Rechner liegen"],["Prompt, conversation, documents and tool results","Only the last sentence you wrote","Only images and photos from the conversation","Only files that are on your computer"]],
     e:["Zum Kontext zählt alles, was die KI bei der Anfrage verwenden kann, auch Tool-Ergebnisse und ihre Antwort.","Context includes everything the AI can use for the request, also tool results and its answer."],
     p:["Was nicht im Kontext steht, kann die KI nicht verwenden.","What is not in the context the AI cannot use."]},
    {q:["Was gilt für sehr viel Text im Kontext?","What applies to a lot of text in the context?"],
     a:[["Genauigkeit und Erinnerung können nachlassen","Die KI wird mit jedem Wort immer besser","Die KI liest nur den ersten Satz davon","Die KI löscht den Kontext sofort"],["Accuracy and recall can degrade","The AI gets better with every word","The AI only reads the first sentence of it","The AI deletes the context immediately"]],
     e:["Mit wachsender Tokenzahl können Genauigkeit und Erinnerung nachlassen.","As the token count grows, accuracy and recall can degrade."],
     p:["Kurz und gezielt schlägt alles hineinwerfen.","Short and targeted beats throwing everything in."]},
    {q:["Welche Probe empfiehlt Anthropic für einen Prompt?","Which test does Anthropic recommend for a prompt?"],
     a:[["Ihn einem Kollegen mit wenig Kontext zeigen","Ihn zur Probe einmal rückwärts lesen","Ihn zur Probe ins Englische übersetzen","Ihn zur Probe auf ein Wort kürzen"],["Show it to a colleague with little context","Read it backwards once as a test","Translate it into English as a test","Shorten it to one word as a test"]],
     e:["Wäre der Kollege verwirrt, wäre es die KI auch.","If the colleague would be confused, the AI would be too."],
     p:["Die goldene Regel für Prompts.","The golden rule for prompts."]}]},

 { t:["Skill: dein Wissen als Anleitung","Skill: your know-how as instructions"],
   ben:["Du erklärst, was ein Skill ist und wann er sich lohnt.","You explain what a skill is and when it is worth it."],
   l:[["Ein Skill ist ein Ordner mit einer Datei SKILL.md. Oben stehen name und description, darunter die Anleitung in Markdown. Dazu können Skripte und Referenzdateien kommen.",
       "H:Beispiel",
       "Du prüfst jede Woche Rechnungen nach denselben acht Punkten. Statt die Punkte jedes Mal in den Prompt zu schreiben, legst du einen Skill „rechnung-pruefen“ an. Die KI lädt ihn, wenn die Aufgabe passt.",
       "H:Skill oder Prompt?",
       "Ein Prompt gilt für eine einzelne Anfrage. Ein Skill lädt bei Bedarf und lohnt sich, wenn du dieselben Anweisungen immer wieder einfügst.",
       "FOLD:Für Profis|Wo Skills laufen","Skills sind ein offener Standard (agentskills.io) und funktionieren in Claude, Claude Code und über die API sowie in weiteren KI-Werkzeugen. Eigene Skills werden zwischen den Oberflächen nicht automatisch synchronisiert.","ENDFOLD"],
      ["A skill is a folder with a file SKILL.md. At the top are name and description, below that the instructions in Markdown. Scripts and reference files can be added.",
       "H:Example",
       "Every week you check invoices against the same eight points. Instead of typing the points into the prompt every time, you create a skill “check-invoice”. The AI loads it when the task fits.",
       "H:Skill or prompt?",
       "A prompt applies to a single request. A skill loads on demand and is worth it when you keep pasting the same instructions.",
       "FOLD:For professionals|Where skills run","Skills are an open standard (agentskills.io) and work in Claude, Claude Code and via the API as well as in other AI tools. Custom skills are not synchronised automatically between the surfaces.","ENDFOLD"]],
   q:[
    {q:["Was ist ein Skill?","What is a skill?"],
     a:[["Ein Ordner mit einer SKILL.md und optionalen Dateien","Eine Browser-Erweiterung zum Übersetzen","Ein Passwortmanager für Teams","Ein Sprachmodell von Anthropic"],["A folder with a SKILL.md and optional files","A browser extension for translating","A password manager for teams","A language model from Anthropic"]],
     e:["Ein Skill ist ein Ordner mit SKILL.md (name, description, Anleitung), optional mit Skripten und Referenzen.","A skill is a folder with SKILL.md (name, description, instructions), optionally with scripts and references."],
     p:["Skill = Anleitung zum Wiederverwenden.","Skill = instructions to reuse."]},
    {q:["Was steht oben in jeder SKILL.md?","What is at the top of every SKILL.md?"],
     a:[["name und description","Ein Passwort und ein Datum","Nur der Programmcode","Nur eine Bilddatei"],["name and description","A password and a date","Only the program code","Only an image file"]],
     e:["Am Anfang stehen mindestens name und description, darunter die Anleitung.","At the top are at least name and description, below that the instructions."],
     p:["Die description sagt der KI, wann der Skill passt.","The description tells the AI when the skill fits."]},
    {q:["Wann lohnt sich ein Skill statt eines Prompts?","When is a skill worth it instead of a prompt?"],
     a:[["Wenn du dieselben Anweisungen immer wieder einfügst","Wenn du eine Frage nur ein einziges Mal stellst","Wenn die KI keine Dateien lesen soll","Wenn du das Gespräch beenden willst"],["When you keep pasting the same instructions","When you ask a question only once","When the AI should not read files","When you want to end the conversation"]],
     e:["Skills laden bei Bedarf, du musst die Anleitung nicht in jedes Gespräch kopieren.","Skills load on demand, you do not have to copy the instructions into every conversation."],
     p:["Dreimal dasselbe getippt? Zeit für einen Skill.","Typed the same thing three times? Time for a skill."]},
    {q:["Welches Beispiel passt zu einem Skill?","Which example fits a skill?"],
     a:[["Eine feste Checkliste zum Prüfen von Rechnungen","Ein einmaliger Gruß zum Start","Ein Passwort für ein fremdes System","Das Abschalten aller Berechtigungen"],["A fixed checklist for checking invoices","A one-time greeting at the start","A password for a foreign system","Turning off all permissions"]],
     e:["Wiederkehrende Abläufe mit festen Schritten sind ideal für Skills.","Recurring processes with fixed steps are ideal for skills."],
     p:["Skill = Prozesswissen, nie Zugangsdaten.","Skill = process knowledge, never credentials."]}]},

 { t:["Tools: die Hände der KI","Tools: the hands of the AI"],
   ben:["Du erklärst den Ablauf, wie eine KI ein Werkzeug nutzt.","You explain how an AI uses a tool."],
   l:[["Eine KI kann von sich aus nur Text erzeugen. Mit Tools kann sie mehr: Dateien lesen, im Web suchen, Daten abfragen. Das nennt man Tool Use oder Function Calling.",
       "H:So läuft es ab",
       "Die KI entscheidet anhand deiner Anfrage und der Tool-Beschreibung, ob sie ein Tool braucht. Sie fordert dann einen Tool-Aufruf mit Name und Eingaben an. Bei Client-Tools führt deine Anwendung den Aufruf aus und schickt das Ergebnis zurück. Danach macht die KI damit weiter.",
       "H:Beispiel",
       "„Wie ist das Wetter in Heilbronn?“ Die KI fordert das Tool „wetter“ mit dem Ort an. Die Anwendung ruft den Dienst ab und gibt die Daten zurück. Die KI formuliert die Antwort.",
       "FOLD:Für Profis|Client- und Server-Tools","Client-Tools laufen in deiner Anwendung. Server-Tools (zum Beispiel Websuche) laufen auf der Infrastruktur des Anbieters. Der Ablauf mit tool_use und tool_result gilt für Client-Tools.","ENDFOLD"],
      ["On its own an AI can only produce text. With tools it can do more: read files, search the web, query data. This is called tool use or function calling.",
       "H:How it works",
       "The AI decides from your request and the tool description whether it needs a tool. It then requests a tool call with a name and inputs. With client tools your application runs the call and sends the result back. The AI then continues with it.",
       "H:Example",
       "“What is the weather in Heilbronn?” The AI requests the tool “weather” with the place. The application queries the service and returns the data. The AI words the answer.",
       "FOLD:For professionals|Client and server tools","Client tools run in your application. Server tools (for example web search) run on the provider's infrastructure. The flow with tool_use and tool_result applies to client tools.","ENDFOLD"]],
   q:[
    {q:["Wer führt einen Client-Tool-Aufruf aus?","Who runs a client tool call?"],
     a:[["Die Anwendung, die mit der KI arbeitet","Die KI selbst im Modell","Du von Hand in jedem Fall","Der Browser des Nutzers immer"],["The application working with the AI","The AI itself inside the model","You by hand in every case","Always the user's browser"]],
     e:["Bei Client-Tools führt deine Anwendung den Aufruf aus und sendet ein tool_result zurück.","With client tools your application runs the call and sends back a tool_result."],
     p:["Die KI bittet, die Anwendung handelt.","The AI asks, the application acts."]},
    {q:["Was fordert die KI bei Tool Use an?","What does the AI request in tool use?"],
     a:[["Einen Tool-Aufruf mit Name und Eingaben","Ein neues Passwort für dein Konto","Ein größeres Modell für die Aufgabe","Ein Update für die ganze App"],["A tool call with a name and inputs","A new password for your account","A larger model for the task","An update for the whole app"]],
     e:["Die KI liefert einen strukturierten Aufruf: Name des Tools und Eingaben.","The AI returns a structured call: name of the tool and inputs."],
     p:["tool_use = die Bestellung der KI.","tool_use = the AI's order."]},
    {q:["Was geht nach der Ausführung zurück an die KI?","What goes back to the AI after execution?"],
     a:[["Das Ergebnis des Tools","Dein Passwort für das System","Das gesamte Internet","Nichts, die KI rät weiter"],["The result of the tool","Your password for the system","The whole internet","Nothing, the AI keeps guessing"]],
     e:["Das Ergebnis kommt als tool_result zurück, und die KI macht damit weiter.","The result comes back as tool_result and the AI continues with it."],
     p:["tool_result = die Lieferung an die KI.","tool_result = the delivery to the AI."]},
    {q:["Wer entscheidet, ob ein Tool genutzt wird?","Who decides whether a tool is used?"],
     a:[["Die KI, anhand der Anfrage und der Tool-Beschreibung","Der Zufall entscheidet bei jeder neuen Anfrage","Nur ein Administrator entscheidet vorab für alle","Die Tastatur des Nutzers entscheidet über Tools"],["The AI, based on the request and the tool description","Chance decides with every new request","Only an administrator decides in advance for all","The user's keyboard decides about tools"]],
     e:["Die KI entscheidet anhand deiner Anfrage und der Beschreibung des Tools.","The AI decides based on your request and the description of the tool."],
     p:["Gute Tool-Beschreibungen helfen der KI bei der Wahl.","Good tool descriptions help the AI choose."]}],
   dd:{de:{dd:1,q:"Bringe den Ablauf von Tool Use in die richtige Reihenfolge.",slots:["Schritt 1","Schritt 2","Schritt 3","Schritt 4"],items:["Die KI fordert einen Tool-Aufruf an","Die Anwendung führt das Tool aus","Das Ergebnis geht als tool_result zurück","Die KI macht mit dem Ergebnis weiter"],e:"Erst fordert die KI den Aufruf an, dann führt die Anwendung ihn aus, das Ergebnis geht zurück, und die KI macht damit weiter."},
       en:{dd:1,q:"Put the tool use flow into the right order.",slots:["Step 1","Step 2","Step 3","Step 4"],items:["The AI requests a tool call","The application runs the tool","The result goes back as tool_result","The AI continues with the result"],e:"First the AI requests the call, then the application runs it, the result goes back and the AI continues with it."}}},

 { t:["MCP: der Anschluss für Werkzeuge und Daten","MCP: the connector for tools and data"],
   ben:["Du erklärst, was MCP ist und wie Host, Client und Server zusammenspielen.","You explain what MCP is and how host, client and server work together."],
   l:[["MCP steht für Model Context Protocol. Es ist ein offener Standard, der KI-Anwendungen mit externen Systemen verbindet, zum Beispiel mit Dateien, Datenbanken oder Diensten wie einem Ticketsystem.",
       "H:Das Bild dazu",
       "Die MCP-Doku vergleicht MCP mit einem USB-C-Anschluss für KI-Anwendungen: ein einheitlicher Stecker, an den sich viele Dinge anschließen lassen. Das Prinzip: einmal bauen, überall anbinden.",
       "H:Die Rollen",
       "Der Host ist die KI-Anwendung. Sie erzeugt für jeden Server einen Client. Der Server ist das Programm, das Kontext liefert. Ein Server kann Tools (Funktionen), Resources (Daten) und Prompts (Vorlagen) anbieten.",
       "FOLD:Für Profis|Transporte und Stand","Lokale Server nutzen meist Stdio, entfernte Server Streamable HTTP (dafür wird OAuth empfohlen). Anthropic stellte MCP im November 2024 vor und übergab es Ende 2025 an die Agentic AI Foundation der Linux Foundation. Die Spezifikation entwickelt sich weiter; prüfe die aktuelle Version auf modelcontextprotocol.io.","ENDFOLD"],
      ["MCP stands for Model Context Protocol. It is an open standard that connects AI applications with external systems, for example files, databases or services such as a ticket system.",
       "H:The picture",
       "The MCP docs compare MCP to a USB-C port for AI applications: one standard plug that many things can connect to. The principle: build once, integrate everywhere.",
       "H:The roles",
       "The host is the AI application. It creates a client for every server. The server is the program that provides context. A server can offer tools (functions), resources (data) and prompts (templates).",
       "FOLD:For professionals|Transports and status","Local servers mostly use stdio, remote servers use streamable HTTP (OAuth is recommended for it). Anthropic introduced MCP in November 2024 and handed it over to the Agentic AI Foundation of the Linux Foundation at the end of 2025. The specification keeps evolving; check the current version on modelcontextprotocol.io.","ENDFOLD"]],
   q:[
    {q:["Wofür steht MCP?","What does MCP stand for?"],
     a:[["Model Context Protocol","Multi Computer Process","Main Control Panel","Mobile Cloud Platform"],["Model Context Protocol","Multi Computer Process","Main Control Panel","Mobile Cloud Platform"]],
     e:["MCP heißt Model Context Protocol.","MCP means Model Context Protocol."],
     p:["Protokoll = vereinbarte Sprache zwischen zwei Seiten.","Protocol = agreed language between two sides."]},
    {q:["Was ist MCP?","What is MCP?"],
     a:[["Ein offener Standard für die Verbindung von KI mit Systemen","Ein Chat-Modell, das Anthropic entwickelt hat","Ein Verfahren zur Verschlüsselung von Dateien","Eine Programmiersprache für große Datenbanken"],["An open standard for connecting AI with systems","A chat model that Anthropic developed","A method for encrypting files","A programming language for large databases"]],
     e:["MCP ist ein offener Standard, der KI-Anwendungen mit externen Systemen verbindet.","MCP is an open standard that connects AI applications with external systems."],
     p:["MCP = Anschluss, nicht Gehirn.","MCP = connector, not brain."]},
    {q:["Welches Bild nutzt die MCP-Doku?","Which picture do the MCP docs use?"],
     a:[["Ein USB-C-Anschluss für KI-Anwendungen","Eine Brücke über einen Fluss","Ein Wasserkreislauf im Haus","Ein Zahnrad in einer Uhr"],["A USB-C port for AI applications","A bridge over a river","A water cycle in a house","A cog in a watch"]],
     e:["Die Doku vergleicht MCP mit einem USB-C-Anschluss für KI-Anwendungen.","The docs compare MCP to a USB-C port for AI applications."],
     p:["Ein Stecker für viele Geräte.","One plug for many devices."]},
    {q:["Was kann ein MCP-Server bereitstellen?","What can an MCP server provide?"],
     a:[["Tools, Resources und Prompts","Nur Bilder und Fotos","Nur Passwörter und Schlüssel","Nur Updates für die App"],["Tools, resources and prompts","Only images and photos","Only passwords and keys","Only updates for the app"]],
     e:["Server bieten Tools (Funktionen), Resources (Daten) und Prompts (Vorlagen) an.","Servers offer tools (functions), resources (data) and prompts (templates)."],
     p:["Tools = tun, Resources = wissen, Prompts = Vorlagen.","Tools = do, resources = know, prompts = templates."]}]},

 { t:["Der Loop: wiederholen bis fertig","The loop: repeat until done"],
   ben:["Du erklärst die Agentenschleife und wie man sie begrenzt.","You explain the agent loop and how to limit it."],
   l:[["Der Loop (die Agentenschleife) ist das Herzstück: Die KI sammelt Kontext, handelt und prüft das Ergebnis. Dann geht es mit dem nächsten Schritt weiter, bis die Aufgabe erledigt ist.",
       "H:Beispiel",
       "Aufgabe: „Behebe den Fehler in der Datei.“ Runde 1: Datei lesen. Runde 2: Fehler korrigieren. Runde 3: Test ausführen. Test grün: fertig. Test rot: nächste Runde.",
       "H:Wann hört er auf?",
       "Im Agent SDK endet die Schleife, wenn die KI ohne Tool-Aufruf antwortet. Du kannst sie begrenzen (maximale Runden, maximales Budget), mit Berechtigungsabfragen steuern oder in Claude Code jederzeit mit Esc stoppen. Ohne Limits läuft sie, bis die KI fertig ist.",
       "FOLD:Für Profis|Hooks und Kontext","Hooks können Aufrufe vor der Ausführung prüfen oder blockieren. Der Kontext wächst mit jeder Runde, deshalb wird er bei Bedarf automatisch zusammengefasst.","ENDFOLD"],
      ["The loop (the agent loop) is the heart: the AI gathers context, takes action and checks the result. Then it continues with the next step until the task is done.",
       "H:Example",
       "Task: “Fix the error in the file.” Round 1: read the file. Round 2: correct the error. Round 3: run the test. Test green: done. Test red: next round.",
       "H:When does it stop?",
       "In the Agent SDK the loop ends when the AI answers without a tool call. You can limit it (maximum turns, maximum budget), steer it with permission prompts or stop it any time with Esc in Claude Code. Without limits it runs until the AI is done.",
       "FOLD:For professionals|Hooks and context","Hooks can check or block calls before they run. The context grows with every round, so it is summarised automatically when needed.","ENDFOLD"]],
   q:[
    {q:["Welche drei Phasen nennt die Doku für die Schleife?","Which three phases do the docs name for the loop?"],
     a:[["Kontext sammeln, handeln, Ergebnis prüfen","Planen, bezahlen, danach alles löschen","Starten, lange warten und beenden","Lesen, wieder vergessen und raten"],["Gather context, take action, verify results","Plan, pay, then delete everything","Start, wait a long time and finish","Read, forget again and guess"]],
     e:["Claude Code arbeitet in den Phasen: Kontext sammeln, handeln und Ergebnis prüfen.","Claude Code works in the phases: gather context, take action and verify results."],
     p:["Sammeln, handeln, prüfen, wieder von vorn.","Gather, act, check, start again."]},
    {q:["Wann endet die Schleife im Agent SDK?","When does the loop end in the Agent SDK?"],
     a:[["Wenn die KI ohne Tool-Aufruf antwortet","Nach genau drei Runden Arbeit","Wenn der Bildschirm gesperrt wird","Sie endet nie von selbst"],["When the AI answers without a tool call","After exactly three rounds of work","When the screen gets locked","It never ends on its own"]],
     e:["Die Schleife endet, wenn die KI eine Antwort ohne Tool-Aufruf liefert.","The loop ends when the AI returns an answer without a tool call."],
     p:["Keine weitere Aktion nötig = fertig.","No further action needed = done."]},
    {q:["Wie stoppst du Claude Code sofort?","How do you stop Claude Code immediately?"],
     a:[["Mit der Taste Esc","Mit der Taste Entf","Mit der Taste Tab","Mit der Taste Enter"],["With the Esc key","With the Delete key","With the Tab key","With the Enter key"]],
     e:["Mit Esc stoppst du Claude sofort; der laufende Tool-Aufruf wird abgebrochen.","With Esc you stop Claude immediately; the running tool call is cancelled."],
     p:["Esc ist deine Notbremse.","Esc is your emergency brake."]},
    {q:["Gibt es im Agent SDK standardmäßig ein Rundenlimit?","Is there a default turn limit in the Agent SDK?"],
     a:[["Nein, Limits wie maxTurns stellt man selbst ein","Ja, es sind immer genau zehn Runden","Ja, es ist immer genau eine Runde","Ja, es gibt ein festes Limit pro Minute"],["No, limits such as maxTurns are set by you","Yes, it is always exactly ten rounds","Yes, it is always exactly one round","Yes, there is a fixed limit per minute"]],
     e:["Standardmäßig gibt es kein Limit. maxTurns und ein Budget lassen sich festlegen.","By default there is no limit. maxTurns and a budget can be set."],
     p:["Grenzen setzt du selbst: Runden, Budget, Berechtigungen.","You set the limits yourself: turns, budget, permissions."]}],
   dd:{de:{dd:1,q:"Ordne zu: Welche Phase der Schleife ist das?",slots:["Die KI liest Dateien und Daten","Die KI ruft ein Tool auf und ändert etwas","Die KI kontrolliert, ob es geklappt hat"],items:["Kontext sammeln","Handeln","Ergebnis prüfen"],e:"Lesen ist Kontext sammeln, Ändern ist Handeln, Kontrollieren ist Ergebnis prüfen."},
       en:{dd:1,q:"Match them: which phase of the loop is it?",slots:["The AI reads files and data","The AI calls a tool and changes something","The AI checks whether it worked"],items:["Gather context","Take action","Verify results"],e:"Reading is gathering context, changing is taking action, checking is verifying results."}}},

 { t:["Der Agent: KI, Werkzeuge und Schleife","The agent: AI, tools and loop"],
   ben:["Du unterscheidest Workflow und Agent und erklärst Subagenten.","You distinguish workflow and agent and explain subagents."],
   l:[["Ein Agent ist eine KI, die Werkzeuge in einer Schleife nutzt und anhand der Rückmeldungen der Umgebung selbst entscheidet, was als Nächstes kommt.",
       "H:Workflow oder Agent?",
       "Im Workflow ist der Ablauf in festem Code vorgegeben: erst A, dann B, dann C. Beim Agent steuert die KI ihren Prozess und den Werkzeugeinsatz dynamisch selbst. Anthropic rät: Fang mit der einfachsten Lösung an, erst bei Bedarf komplexer.",
       "H:Beispiel",
       "Workflow: Jede Rechnung durchläuft immer dieselben drei Prüfungen. Agent: Eine Support-Anfrage kann Recherche, Rückfrage und mehrere Tools brauchen, die Reihenfolge ergibt sich unterwegs.",
       "FOLD:Für Profis|Subagenten","Ein Subagent ist ein Hilfs-Agent mit eigenem Kontextfenster, eigenem System-Prompt und begrenzten Tools. Der Hauptagent delegiert Teilaufgaben und bekommt nur die Zusammenfassung zurück. Das schont seinen Kontext und lässt Rechte einschränken.","ENDFOLD"],
      ["An agent is an AI that uses tools in a loop and decides itself what comes next based on feedback from the environment.",
       "H:Workflow or agent?",
       "In a workflow the process is set in fixed code: first A, then B, then C. With an agent the AI steers its process and tool use dynamically itself. Anthropic advises: start with the simplest solution, add complexity only when needed.",
       "H:Example",
       "Workflow: every invoice always goes through the same three checks. Agent: a support request may need research, a follow-up question and several tools, the order emerges along the way.",
       "FOLD:For professionals|Subagents","A subagent is a helper agent with its own context window, its own system prompt and limited tools. The main agent delegates sub-tasks and only gets the summary back. This protects its context and lets you restrict permissions.","ENDFOLD"]],
   q:[
    {q:["Was unterscheidet einen Workflow von einem Agenten?","What distinguishes a workflow from an agent?"],
     a:[["Workflow: fester Ablauf. Agent: die KI steuert selbst","Ein Workflow nutzt keine KI, ein Agent schon","Ein Agent ist immer langsamer als ein Workflow","Beide sind das Gleiche mit anderem Namen"],["Workflow: fixed process. Agent: the AI steers itself","A workflow uses no AI, an agent does","An agent is always slower than a workflow","Both are the same with a different name"]],
     e:["Im Workflow geben Code-Pfade den Ablauf vor, beim Agenten steuert die KI Prozess und Werkzeuge dynamisch.","In a workflow code paths set the process, with an agent the AI steers process and tools dynamically."],
     p:["Workflow = Fahrplan, Agent = Fahrer mit Ziel.","Workflow = timetable, agent = driver with a destination."]},
    {q:["Woraus besteht ein Agent im Kern?","What does an agent consist of at its core?"],
     a:[["Aus einer KI, die Werkzeuge in einer Schleife nutzt","Aus einem Chatfenster und einer Tastatur","Aus einer Tabelle mit festen Regeln","Aus einem Passwort und einer Datei"],["An AI that uses tools in a loop","A chat window and a keyboard","A table with fixed rules","A password and a file"]],
     e:["Anthropic beschreibt Agenten als LLMs, die Tools auf Basis von Rückmeldungen der Umgebung in einer Schleife nutzen.","Anthropic describes agents as LLMs using tools in a loop based on environmental feedback."],
     p:["Agent = KI + Tools + Loop.","Agent = AI + tools + loop."]},
    {q:["Was empfiehlt Anthropic beim Start?","What does Anthropic recommend at the start?"],
     a:[["Mit der einfachsten Lösung anfangen","Gleich einen komplexen Agenten bauen","Nie Beispiele verwenden","Alles in einen einzigen Prompt packen"],["Start with the simplest solution","Build a complex agent right away","Never use examples","Put everything into a single prompt"]],
     e:["Beginne mit einfachen Prompts und füge mehrstufige Systeme nur hinzu, wenn einfachere Lösungen nicht reichen.","Start with simple prompts and add multi-step systems only when simpler solutions fall short."],
     p:["Erst Prompt, dann Skill, dann Agent, wenn nötig.","First prompt, then skill, then agent if needed."]},
    {q:["Was ist ein Subagent?","What is a subagent?"],
     a:[["Ein Hilfs-Agent mit eigenem Kontextfenster","Ein Agent, der keine Werkzeuge nutzen darf","Eine zweite Anmeldung am selben Konto","Ein Skill, der nur Bilder erzeugt"],["A helper agent with its own context window","An agent that may not use any tools","A second login to the same account","A skill that only creates images"]],
     e:["Ein Subagent läuft mit eigenem Kontextfenster, eigenem System-Prompt und begrenzten Tools.","A subagent runs with its own context window, its own system prompt and limited tools."],
     p:["Hauptagent delegiert, Subagent liefert eine Zusammenfassung.","Main agent delegates, subagent returns a summary."]}]},

 { t:["Das Zusammenspiel: wer macht was?","The interplay: who does what?"],
   ben:["Du erklärst an einem Beispiel, wie Prompt, Skill, MCP, Loop und Agent zusammenarbeiten.","You explain with an example how prompt, skill, MCP, loop and agent work together."],
   l:[["Alle Bausteine haben eine eigene Aufgabe. Der Prompt nennt das Ziel. Der Skill liefert die Anleitung. MCP liefert den Zugang zu Systemen. Der Loop treibt die Arbeit in Runden voran. Der Agent ist das Ganze zusammen.",
       "H:Ein Beispiel von vorn bis hinten",
       "Prompt: „Lege zu dieser E-Mail ein Ticket an.“ Der Agent liest die E-Mail (Tool). Er lädt den Skill „ticket-regeln“ mit den Pflichtfeldern (Skill). Er legt das Ticket im Ticketsystem an (MCP-Server). Er prüft, ob das Ticket existiert (Loop). Dann meldet er das Ergebnis.",
       "H:Merksatz",
       "Prompt = Was. Skill = Wie. MCP = Womit. Loop = Wie lange. Agent = Wer macht es."],
      ["All building blocks have their own job. The prompt names the goal. The skill provides the instructions. MCP provides access to systems. The loop drives the work forward in rounds. The agent is all of it together.",
       "H:An example from start to finish",
       "Prompt: “Create a ticket for this email.” The agent reads the email (tool). It loads the skill “ticket-rules” with the required fields (skill). It creates the ticket in the ticket system (MCP server). It checks that the ticket exists (loop). Then it reports the result.",
       "H:Rule of thumb",
       "Prompt = what. Skill = how. MCP = with what. Loop = how long. Agent = who does it."]],
   q:[
    {q:["Welcher Baustein gibt Zugang zu externen Systemen?","Which building block gives access to external systems?"],
     a:[["MCP","Der Prompt","Die Beschreibung des Skills","Das Kontextfenster"],["MCP","The prompt","The description of the skill","The context window"]],
     e:["MCP verbindet KI-Anwendungen mit externen Systemen.","MCP connects AI applications with external systems."],
     p:["MCP = Womit.","MCP = with what."]},
    {q:["Welcher Baustein liefert die wiederverwendbare Anleitung?","Which building block provides the reusable instructions?"],
     a:[["Der Skill","Der Loop","Das Kontextfenster","Der MCP-Server"],["The skill","The loop","The context window","The MCP server"]],
     e:["Ein Skill bündelt eine Anleitung, die bei passender Aufgabe geladen wird.","A skill bundles instructions that load when the task fits."],
     p:["Skill = Wie.","Skill = how."]},
    {q:["Was macht der Prompt in einem Agenten-Ablauf?","What does the prompt do in an agent flow?"],
     a:[["Er nennt das Ziel der Aufgabe","Er ersetzt den Skill","Er ersetzt den MCP-Server","Er beendet den Loop"],["It names the goal of the task","It replaces the skill","It replaces the MCP server","It ends the loop"]],
     e:["Der Prompt sagt, was erreicht werden soll. Skill, MCP und Loop helfen beim Wie.","The prompt says what should be achieved. Skill, MCP and loop help with how."],
     p:["Prompt = Was.","Prompt = what."]},
    {q:["Nur ein Prompt, aber der Agent soll das Ticketsystem nutzen. Was fehlt?","Only a prompt, but the agent should use the ticket system. What is missing?"],
     a:[["Eine Verbindung zum System, zum Beispiel über MCP","Ein größerer Bildschirm für den Nutzer","Mehr Großbuchstaben im Prompt","Ein neuer Name für den Skill"],["A connection to the system, for example via MCP","A bigger screen for the user","More capital letters in the prompt","A new name for the skill"]],
     e:["Ohne Zugang kann der Agent das System nicht bedienen. MCP ist ein Weg dafür.","Without access the agent cannot operate the system. MCP is one way to provide it."],
     p:["Wissen (Skill) ersetzt keinen Zugang (MCP).","Know-how (skill) does not replace access (MCP)."]}],

function certRender(){ $("cprev").innerHTML = certSvg(["100%", "auto"]); }
function certCanvas(cb){
  const img = new Image();
  img.onload = () => { const cv = document.createElement("canvas"); cv.width = 2480; cv.height = 1754; const x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 2480, 1754); x.drawImage(img, 0, 0, 2480, 1754); cb(cv); };
  img.onerror = () => { $("cmsg").textContent = "Fehler / Error"; $("cmsg").classList.remove("hide"); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(certSvg([2480, 1754]));
}
function certFileName(ext){ const n = (certLoad().name || "").trim().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, ""); return t("cFile") + (n ? "-" + n : "") + "." + ext; }
function certSaveBlob(blob, fn){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function certPdfBlob(jpeg, w, h){
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = d => { const b = typeof d === "string" ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(n + " 0 obj\n" + body + "\nendobj\n"); };
  push("%PDF-1.4\n");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  offs[4] = len; push("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + w + " /Height " + h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n"); push(jpeg); push("\nendstream\nendobj\n");
  const cs = "q 841.89 0 0 595.28 0 0 cm /Im0 Do Q";
  obj(5, "<< /Length " + cs.length + " >>\nstream\n" + cs + "\nendstream");
  const xr = len; let x = "xref\n0 6\n0000000000 65535 f \n";
  for(let n = 1; n <= 5; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  push(x + "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xr + "\n%%EOF");
  return new Blob(parts, {type: "application/pdf"});
}
function certDownload(kind){
  if(!(certLoad().name || "").trim()){ $("cmsg").textContent = t("certNeed"); $("cmsg").classList.remove("hide"); $("cname").focus(); return; }
  $("cmsg").classList.add("hide");
  certCanvas(cv => {
    if(kind === "png") cv.toBlob(b => certSaveBlob(b, certFileName("png")), "image/png");
    else { const bin = atob(cv.toDataURL("image/jpeg", 0.93).split(",")[1]), u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); certSaveBlob(certPdfBlob(u, cv.width, cv.height), certFileName("pdf")); }
  });
}
function openCert(){

}
