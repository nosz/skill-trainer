<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1f2026;--mute:#4d4f54;--line:#d8d7d1;--brandbg:#e6ecff;--brand:#4970ff;--brand2:#2f52e0;--accent:#ff9619;--ok:#14a373;--okbg:#e5f7ef;--warn:#b86a00;--warnbg:#fff3e0;--btn:#2f52e0;--btnh:#2441b8;--okt:#0b6b4d;--warnt:#8a4f00;--okf:#0a7d59;--onokf:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#17181c;--card:#202228;--ink:#f2f1ee;--mute:#b3b5bb;--line:#383a42;--brandbg:#232a4a;--brand:#6f8cff;--brand2:#9fb2ff;--accent:#ffa940;--ok:#3fcf9b;--okbg:#10352b;--warn:#ffb85c;--warnbg:#3a2a10;--btn:#3f63e8;--btnh:#2f4fd1;--okt:#3fcf9b;--warnt:#ffb85c;--okf:#3fcf9b;--onokf:#10352b}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:var(--brand2)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.logo{height:26px;width:auto;display:block;flex:none}.logo .lw{fill:var(--ink)}.logo .li{fill:#4970ff}
.univ{font-weight:700;letter-spacing:-.01em;padding-left:10px;border-left:1px solid var(--line);white-space:nowrap}
.lang{display:flex;gap:6px}
.lang button{min-height:36px;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hero{margin:22px 0 18px;padding:26px 22px;border-radius:20px;background:linear-gradient(135deg,#3a5ef0 0%,#2f52e0 100%);color:#fff}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hero h1{margin:6px 0 8px;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.12;letter-spacing:-.02em}
.hero p{margin:0 0 16px;max-width:60ch;color:rgba(255,255,255,.92)}
.cta{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:10px;background:#fff;color:#1f2026;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:1rem}
.cta:hover{background:#eef1ff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:1.7rem;line-height:1.1;letter-spacing:-.02em}.stat span{font-size:.85rem;color:var(--mute)}
.ovbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}.ovbar i{display:block;height:100%;background:var(--brand);width:0;transition:width .4s}
h2.sec{font-size:1.25rem;margin:26px 0 12px;letter-spacing:-.01em}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brandbg);border-color:var(--brand);color:var(--brand2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h3{margin:0 0 2px;font-size:1.15rem;line-height:1.25}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 10px}
.card p.desc{margin:0 0 12px;color:var(--mute);font-size:.95rem}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brandbg);color:var(--brand2);margin-bottom:12px}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.b-new{background:var(--brandbg);color:var(--brand2)}.b-run{background:var(--warnbg);color:var(--warnt)}.b-done{background:var(--okbg);color:var(--okt)}
.lv{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.lvb{font-size:.75rem;padding:2px 9px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--mute);margin:0 0 12px}
.prog{margin:auto 0 12px}.prog small{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem}
.act{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 18px;border-radius:10px;background:var(--btn);color:#fff;font-weight:700;text-decoration:none;border:1px solid var(--btn);font-size:.95rem;flex:1 1 auto}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn.alt{background:var(--card);color:var(--brand2);border-color:var(--brand)}.btn.alt:hover{background:var(--brandbg)}
details.les{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.les summary{cursor:pointer;font-size:.9rem;font-weight:600;color:var(--brand2);min-height:44px;display:flex;align-items:center}
details.les ol{margin:8px 0 0;padding:0;list-style:none}
details.les li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:.9rem}
details.les li i{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.7rem;color:var(--mute);margin-top:2px}
details.les li.ok i{background:var(--okf);border-color:var(--okf);color:var(--onokf)}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.path{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.path h3{margin:0 0 4px;font-size:1.1rem}.path p{margin:0 0 12px;color:var(--mute);font-size:.92rem}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps li a{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none}
.steps li a:hover{border-color:var(--brand)}
.steps .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brandbg);color:var(--brand2);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.steps li.done .n{background:var(--okf);color:var(--onokf)}
.steps .st{margin-left:auto;font-size:.8rem;color:var(--mute);white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.hide{display:none}
footer{margin:34px 0 28px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.hero{padding:20px 16px}.univ{font-size:.9rem}}
@media(max-width:380px){.univ{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function state(app){
  let p = {}; try{ p = JSON.parse(ls(app.key) || "{}") || {}; }catch(e){ p = {}; }
  const ok = app.q.map((n,i) => (p[i] || 0) >= Math.ceil((p["n"+i] || n) * 0.75));
  const done = ok.filter(Boolean).length, started = Object.keys(p).some(k => /^\d+$/.test(k));
  let name = ""; const raw = ls(app.cert);
  if(raw){ if(app.certJson){ try{ name = (JSON.parse(raw).name || "").trim(); }catch(e){ name = ""; } } else name = raw.trim(); }
  return {ok, done, total:app.q.length, started, complete: done === app.q.length, name,
          status: done === app.q.length ? "done" : (started ? "run" : "new")};
}
const totalQ = app => app.q.reduce((a,b)=>a+b,0);
const nextApp = () => {

  const st = a => state(a);
  return order.find(a => st(a).status === "run") || order.find(a => st(a).status === "new") || null;
};

function renderStats(){
  const s = APPS.map(state), sum = f => s.reduce((a,x)=>a+f(x),0);

  tile(String(APPS.length), t("sApps"));
  tile(done + t("of") + total, t("sLes"), total ? Math.round(100*done/total) : 0);

}
function renderCta(){
  const a = nextApp(), c = $("cta");
  if(!a){ c.textContent = t("ctaDone"); c.href = "#apps"; return; }
  const s = state(a); c.textContent = (s.status === "run" ? t("ctaGo") : t("ctaNew")) + a.title[lang]; c.href = a.file;
}
function matches(a){
  const q = filt.q.trim().toLowerCase();
  const hay = (a.title[lang] + " " + a.sub[lang] + " " + a.desc[lang] + " " + a.lessons[lang].join(" ") + " " + a.title.de + " " + a.title.en).toLowerCase();
  if(q && !hay.includes(q)) return false;
  if(filt.f === "all") return true;
  if(["ki","script","ninox4"].includes(filt.f)) return a.topics.includes(filt.f);
  return a.levels.includes(filt.f);
}
function card(a){
  const s = state(a), c = el("article","card"), top = el("div","top");
  const ic = el("div","ico"); ic.appendChild(ICON(a.icon)); top.appendChild(ic);
  top.appendChild(el("span","badge " + (s.status === "done" ? "b-done" : s.status === "run" ? "b-run" : "b-new"), t(s.status === "done" ? "stDone" : s.status === "run" ? "stRun" : "stNew")));
  c.appendChild(top);
  c.appendChild(el("h3",null,a.title[lang])); c.appendChild(el("p","sub",a.sub[lang]));
  c.appendChild(el("p","desc",a.desc[lang]));
  const lv = el("div","lv"); a.levels.forEach(l => lv.appendChild(el("span","lvb", t(l === "einsteiger" ? "lE" : l === "fortgeschritten" ? "lF" : "lP")))); c.appendChild(lv);
  const m = el("div","meta"); [a.q.length + " " + t("lessons"), totalQ(a) + " " + t("questions"), t("min").replace("{n}", a.minutes), a.langs].forEach(x => m.appendChild(el("span",null,x))); c.appendChild(m);
  const pr = el("div","prog"), sm = el("small"); sm.appendChild(el("span",null,s.done + t("of") + s.total + " " + t("passed"))); if(s.name) sm.appendChild(el("span",null,"★ " + t("cert") + ": " + s.name)); pr.appendChild(sm);
  const bar = el("div","ovbar"), i = el("i"); i.style.width = Math.round(100*s.done/s.total) + "%"; bar.appendChild(i); pr.appendChild(bar); c.appendChild(pr);
  const act = el("div","act"), b = el("a","btn", t(s.status === "done" ? "again" : s.status === "run" ? "cont" : "start")); b.href = a.file; act.appendChild(b); c.appendChild(act);
  const d = el("details","les"); d.appendChild(el("summary",null,t("show"))); const ol = el("ol");
  a.lessons[lang].forEach((n,k) => { const li = el("li", s.ok[k] ? "ok" : ""); li.appendChild(el("i",null,s.ok[k] ? "✓" : String(k+1))); li.appendChild(el("span",null,n)); ol.appendChild(li); });
  d.appendChild(ol); c.appendChild(d);
  return c;
}
function renderGrid(){
  const g = $("grid"); g.innerHTML = ""; const list = APPS.filter(matches);
  list.forEach(a => g.appendChild(card(a))); $("none").classList.toggle("hide", list.length > 0); $("none").textContent = t("none");
}
function renderChips(){
  const box = $("chips"); box.innerHTML = "";
  [["all","all"],["ki","fKi"],["script","fScript"],["ninox4","fN4"],["einsteiger","fE"],["fortgeschritten","fF"],["profi","fP"]].forEach(([k,l]) => {
    const b = el("button","chip",t(l)); b.type = "button"; b.setAttribute("aria-pressed", String(filt.f === k)); b.onclick = () => { filt.f = k; renderChips(); renderGrid(); }; box.appendChild(b); });
}
function renderPaths(){
  const box = $("paths"); box.innerHTML = "";
  PATHS.forEach(p => { const d = el("div","path"); d.appendChild(el("h3",null,p.title[lang])); d.appendChild(el("p",null,p.desc[lang]));
    const ul = el("ol","steps"); p.apps.forEach((id,n) => { const a = APPS.find(x => x.id === id), s = state(a); const li = el("li", s.complete ? "done" : ""); const link = el("a"); link.href = a.file;
      link.appendChild(el("span","n", s.complete ? "✓" : String(n+1))); link.appendChild(el("span",null,a.title[lang])); link.appendChild(el("span","st", s.done + t("of") + s.total)); li.appendChild(link); ul.appendChild(li); });
    d.appendChild(ul); box.appendChild(d); });
}
function render(){
  document.documentElement.lang = lang;
  $("eyebrow").textContent = t("eyebrow"); $("h1").textContent = t("h1"); $("lead").textContent = t("lead");
  $("apps").textContent = t("appsH"); $("paths-h").textContent = t("pathsH"); $("q").placeholder = t("search"); $("q").setAttribute("aria-label", t("search"));
  $("foot").textContent = t("foot"); $("ver").textContent = "v" + VERSION;
  ["de","en"].forEach(l => $("l-"+l).setAttribute("aria-pressed", String(l === lang)));
  renderStats(); renderCta(); renderChips(); renderGrid(); renderPaths();
}
$("l-de").onclick = () => { lang = "de"; try{ localStorage.setItem("ninox_university_lang","de"); }catch(e){} render(); };
$("l-en").onclick = () => { lang = "en"; try{ localStorage.setItem("ninox_university_lang","en"); }catch(e){} render(); };
$("q").oninput = e => { filt.q = e.target.value; renderGrid(); };
// Fortschritt aktualisieren, wenn man aus einer App zurueckkommt oder in einem anderen Tab lernt
window.addEventListener("pageshow", render); window.addEventListener("storage", render);
document.addEventListener("visibilitychange", () => { if(!document.hidden) render(); });
render();
</script>
</body>
</html>
