<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1f2026;--mute:#4d4f54;--line:#d8d7d1;--brandbg:#e6ecff;--brand:#4970ff;--brand2:#2f52e0;--accent:#ff9619;--ok:#14a373;--okbg:#e5f7ef;--bad:#d93a40;--badbg:#fdeded;--hero1:#fff;--hero2:#fff;--code:#f1f0ec}
@media(prefers-color-scheme:dark){:root{--bg:#17181c;--card:#202228;--ink:#f2f1ee;--mute:#b3b5bb;--line:#383a42;--brandbg:#232a4a;--brand:#6f8cff;--brand2:#9fb2ff;--accent:#ffa940;--ok:#3fcf9b;--okbg:#10352b;--bad:#f07a7e;--badbg:#3a1d20;--hero1:#202228;--hero2:#202228;--code:#1a1b20}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:760px;margin:0 auto;padding:16px 16px 44px}
h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.15;margin:6px 0 10px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;line-height:1.3;margin:0 0 16px;font-weight:700}
p{margin:0 0 14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(11,27,52,.04),0 8px 24px rgba(11,27,52,.05)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:14px 16px;text-align:left;width:100%;margin-bottom:10px;min-height:50px;transition:border-color .15s,background .15s}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;text-align:center;font-weight:700}
button.primary:hover:not(:disabled){background:var(--brand2)}button.primary:disabled{opacity:.5;cursor:not-allowed}
button.ghost{text-align:center;color:var(--mute);background:transparent}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}.opt:disabled{cursor:default}
.opt{display:flex;align-items:flex-start;gap:12px}.opt::before{flex:none;content:attr(data-k);display:inline-grid;place-items:center;width:28px;height:28px;margin:0;border:1px solid var(--line);border-radius:50%;font-size:.85rem;font-weight:700;color:var(--mute);background:var(--bg)}
.opt.ok::before{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad::before{background:var(--bad);border-color:var(--bad);color:#fff}
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);color:#fff;border-radius:20px;padding:22px 20px 20px;margin-bottom:16px}
.hero p{color:rgba(255,255,255,.84)}.hero h1{color:#fff}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px}
.lang{display:flex;gap:6px;justify-content:flex-end;float:right}
.lang button{width:auto;margin:0;min-height:34px;padding:5px 13px;text-align:center;font-size:.85rem;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.lang button[aria-pressed=true]{background:#fff;color:var(--hero1);border-color:#fff}
.ov{display:flex;align-items:center;gap:12px;margin:14px 0 10px;font-size:.9rem;color:rgba(255,255,255,.85)}
.ovb{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}.ovb i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.rank{display:inline-block;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:3px 12px;font-size:.88rem}
.why{background:rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;margin:14px 0 6px}.why h2{color:#fff;font-size:1.05rem;margin:0 0 6px}.why p{margin:0 0 8px;font-size:.93rem}.why ul{margin:0;padding-left:20px;font-size:.92rem;color:rgba(255,255,255,.9)}.why li{margin-bottom:6px}.why .pt{margin:0 0 12px}.why .pt b{display:block;margin-bottom:4px}.why .pt p{margin:0 0 5px;font-size:.9rem;color:rgba(255,255,255,.92)}.tag{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:1px}.why b{color:#fff}
.hero #note{font-size:.88rem;margin-top:10px;margin-bottom:0}
.sec{margin:22px 4px 10px;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:800}
.sec.pro{color:var(--accent)}.sec.pro::after{content:"PRO";margin-left:10px;font-size:.7rem;background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.05em}
.lv{margin-bottom:8px}.lv button{margin:0;display:flex;gap:14px;align-items:center}.lv button:disabled{opacity:.5;cursor:not-allowed}
.lv button:hover:not(:disabled){border-color:var(--brand)}
.nr{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.lv .done .nr{background:var(--ok);border-color:var(--ok);color:#fff}.lv small{display:block;color:var(--mute)}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-bottom:8px;font-weight:600}
.bar{display:flex;gap:4px;margin:0 0 20px}.seg{flex:1;height:8px;border-radius:4px;background:var(--line)}
.seg.ok{background:var(--ok)}.seg.bad{background:var(--bad)}.seg.cur{background:var(--brand)}.seg.now{outline:2px solid var(--brand);outline-offset:1px}
.fb{margin:8px 0 14px;padding:13px 15px;border-radius:12px;background:var(--bg);border-left:4px solid var(--brand);font-size:.95rem}
.score{font-size:3.2rem;font-weight:800;line-height:1;margin:6px 0 4px;letter-spacing:-.02em}
.lesson{background:var(--bg);border-radius:12px;padding:16px 18px;margin-bottom:16px}.lesson p{color:var(--ink);margin:0 0 10px}.lesson p:last-child{margin:0}
.lesson pre{margin:0 0 10px;padding:12px 14px;background:var(--code);border:1px solid var(--line);border-radius:10px;font:.84rem/1.55 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;color:var(--ink)}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:.95rem}.rev b{display:block}.rev span{color:var(--mute)}
.hint{font-size:.8rem;text-align:center;margin:4px 0 0}
.ex{text-align:center;font-weight:700;color:var(--brand);border:2px solid var(--brand);background:var(--card)}.ex:hover{background:var(--bg)}
.exbox{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.exh{padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--line);font:600 .82rem/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}
.exh::before{content:"● ● ●";letter-spacing:2px;margin-right:12px;color:var(--line)}
.exc{padding:6px 14px 12px}
.plabel{font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--brand);margin:12px 0 5px}
.code{margin:0 0 4px;padding:11px 13px;background:var(--code);border:1px solid var(--line);border-radius:8px;font:.83rem/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.code.fm{border-left:4px solid var(--brand)}.code.bd{border-left:4px solid var(--accent)}
.code .pr{color:var(--accent);font-weight:700}.code .k{color:var(--brand);font-weight:700}.code .hd{font-weight:700}.code .who{font-weight:700;color:var(--brand)}
.code .okc{color:var(--ok);font-weight:700}.code .badc{color:var(--bad);font-weight:700}
.exn{margin:0;padding:11px 14px;border-top:1px solid var(--line);font-size:.9rem;color:var(--ink);background:var(--bg)}.exn::before{content:attr(data-l) " · ";font-weight:700;color:var(--brand)}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px dashed var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;min-height:56px}
.slot .sl{flex:1 1 150px;font-size:.92rem;color:var(--mute)}.slot .drop{flex:1 1 150px;min-height:38px;display:flex}
.slot.over{border-color:var(--brand);background:var(--bg)}.slot.ok{border:2px solid var(--ok);background:var(--okbg)}.slot.bad{border:2px solid var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:52px;padding:8px;border:1px dashed var(--line);border-radius:12px}
.chip{width:auto;margin:0;min-height:40px;padding:8px 12px;border-radius:10px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-size:.9rem;background:var(--card)}
.chip.sel{outline:3px solid var(--brand)}.chip:disabled{cursor:default;color:var(--ink)}
.chip.dragging{position:fixed;z-index:20;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.28);opacity:.95}
.src{margin:0 0 16px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:.9rem}.src h3{margin:0 0 6px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.src h4{margin:10px 0 4px;font-size:.9rem}.src ul{margin:0;padding-left:20px}.src li{margin:2px 0}.src a,.useful a{color:var(--brand);font-weight:600;overflow-wrap:anywhere}.useful{margin:18px 0 8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.useful h2{margin:0 0 4px;font-size:1rem}.useful p{margin:6px 0 0;font-size:.82rem;color:var(--mute)}.useful ul{margin:0;padding:0;list-style:none;font-size:.9rem}.useful li{margin:0;padding:8px 0;border-top:1px solid var(--line)}.useful li:first-child{border-top:0}.useful li small{display:block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.useful li span{display:block;color:var(--mute);font-size:.82rem;line-height:1.35}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-6px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}.navb{display:inline-flex;align-items:center;gap:6px;width:auto;margin:0;min-height:38px;padding:6px 12px 6px 8px;border-radius:10px;font-size:.9rem;font-weight:600;color:var(--brand);background:transparent;border-color:transparent;flex:none}.navb:hover{background:var(--bg);border-color:var(--line)}.navl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem;font-weight:600;color:var(--mute)}
.exu{margin:0;padding:10px 14px;border-top:1px solid var(--line);font-size:.88rem;background:var(--card)}.exu a{color:var(--brand);font-weight:600}
footer{text-align:center;font-size:.8rem;color:var(--mute);margin-top:22px}
.hide{display:none}

.hero{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:24px 20px 20px}
.hero h1{color:var(--ink);font-size:clamp(1.8rem,6vw,2.5rem);margin:14px 0 8px}
.hero p{color:var(--mute)}
.eyebrow{background:var(--brandbg);color:var(--brand)}
.lang button{color:var(--mute);border-color:var(--line)}
.lang button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.ov{color:var(--mute)}.ovb{background:var(--line)}
.rank{border-color:var(--line);color:var(--ink);background:transparent}
.why{background:transparent;border-radius:0;padding:0;margin:18px 0 8px}
.why .pt{margin:0 0 14px;padding:2px 0 2px 14px;border-left:3px solid var(--brand)}
.why .pt b{display:block;margin:0 0 2px;color:var(--ink);font-size:1.02rem}
.why .pt p{margin:0;font-size:.95rem;color:var(--mute)}
.lv button small:empty{display:none}
.card{box-shadow:none}
.sec{color:var(--mute);font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
/* 3.6.0 Motivation: Nutzen vorn, Als-Nächstes, Feiern */
.hero #cta{margin:10px 0 6px;min-height:54px;font-size:1.05rem;border-radius:14px}
.lv button.next{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.badge{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;background:var(--brand);color:#fff;font-size:.68rem;font-style:normal;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:2px}
.gain{margin:-4px 0 16px;padding:12px 14px;border-radius:12px;background:var(--brandbg);color:var(--ink)}
.gain b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:2px}
.gain span{display:block;font-weight:600}
.gain small{display:block;margin-top:6px;color:var(--mute);font-size:.82rem}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.score.pass{animation:pop .5s ease-out;color:var(--ok)}
@media(prefers-reduced-motion:reduce){.confetti{display:none}.score.pass{animation:none}}

.vs{display:grid;gap:10px;margin:6px 0 10px}
@media(min-width:560px){.vs{grid-template-columns:1fr 1fr}}
.vsr{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.vsr b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.vsr span{font-size:.92rem;color:var(--ink)}
.vsr.no b{color:var(--bad)}
.vsr.yes{border-color:var(--ok);background:var(--okbg)}.vsr.yes b{color:var(--ok)}
/* 3.10.0 Grafiken im Start-Kapitel */
.gfx{margin:14px 0}
.gh{margin:26px 0 8px;font-size:1.08rem;color:var(--ink)}
.leg{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.leg i{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-style:normal;font-size:.8rem;font-weight:700}
.leg b{display:block;margin:0 0 2px;color:var(--ink);font-size:.98rem}.leg span{display:block;color:var(--mute);font-size:.93rem;line-height:1.4}
.gfx svg{width:100%;height:auto;display:block;max-width:460px;margin:0 auto}
.gfx .bx{fill:var(--card);stroke:var(--line);stroke-width:1.5}.gfx .bg{fill:var(--bg);stroke:var(--line)}.gfx .sb{fill:var(--bg)}.gfx .ln{stroke:var(--line);stroke-width:1.5}
.gfx text{font-family:inherit}.gfx .t{fill:var(--ink);font-size:13px}.gfx .m{fill:var(--mute)}.gfx .t.s{font-size:11px}.gfx .mb{fill:var(--line)}.gfx .bd{fill:var(--brand)}
.gfx .num{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle}.gfx .ic{fill:none;stroke:var(--mute);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gfx .ico{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round}.gfx .ar2{fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.gfx .t.b{fill:var(--brand)}
/* 3.2.2 Feinschliff + Handy */
html{-webkit-text-size-adjust:100%}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.card{border-radius:18px}
.hero{box-shadow:0 10px 28px rgba(11,27,52,.18)}

.eyebrow{background:transparent;color:var(--brand2);padding:0;border-radius:0;font-size:.78rem;font-weight:600;letter-spacing:.08em}
.card{border-radius:24px;border-color:var(--line)}

button.primary:hover:not(:disabled){background:var(--brand2);border-color:var(--brand2)}
.hero #cta{font-size:1.02rem}
.lang button{border-radius:4px;font-weight:600}

.ovb{height:6px;background:var(--line)}.ovb i{background:var(--brand)}

.vsr{border-radius:12px;background:var(--bg)}
.sec{color:var(--ink);font-weight:600;letter-spacing:.08em}
.lv button{border-radius:12px;background:var(--card)}
.lv button:disabled{background:var(--bg)}

.badge{border-radius:4px;background:var(--accent);color:#1f2026}

.gain{background:var(--brandbg);border-radius:12px}.gain b{color:var(--brand2)}

.ex{border-color:var(--brand);border-radius:4px}

.leg{border-radius:12px}
.exbox,.src,.useful,.fb{border-radius:12px}

.seg.cur,.seg.now{background:var(--brand)}.seg.now{outline-color:var(--brand)}

.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:10px 16px;font-weight:600;font-size:1.02rem;color:var(--ink)}

.fold summary::after{content:"+";flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brandbg);color:var(--brand2);font-size:1.2rem;line-height:1}

.kr{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.kh+.kr{border-top:0}

.lfold summary{min-height:60px}
.lfold summary b{display:block;font-weight:600;color:var(--ink)}
.lfold summary small{display:block;margin-top:2px;font-size:.8rem;font-weight:600;color:var(--brand2)}
.lfold[open] summary small{display:none}
.lfold:not([open]){border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.lfold:not([open]) summary::after{animation:nudge 2.6s ease-in-out infinite}
.lfold[open] .foldb{animation:foldin .28s ease-out}
@keyframes nudge{0%,55%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(73,112,255,0)}68%{transform:scale(1.18);box-shadow:0 0 0 7px rgba(73,112,255,.2)}82%{transform:scale(1);box-shadow:0 0 0 0 rgba(73,112,255,0)}}
@keyframes foldin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

const CH = [
 { t:["Was ist ein Prompt?","What is a prompt?"],
   ben:["Du erklärst, was ein Prompt ist, und wendest die goldene Regel an.","You explain what a prompt is and apply the golden rule."],
   l:[["Ein Prompt ist die Anweisung oder Eingabe, mit der du der KI sagst, was sie tun soll. Gutes Prompten ist keine Zauberei, sondern gutes Anweisen.",
       "H:Beispiel: schlecht und besser",
       "Schlecht: „Schreib was über unser Produkt.“ Besser: „Schreibe eine Produktbeschreibung für unser Kundenportal in 80 Wörtern. Zielgruppe: Vertriebsleiter. Ton: sachlich und freundlich.“",
       "H:Die goldene Regel",
       "Zeige deinen Prompt einem Kollegen, der wenig Kontext zur Aufgabe hat, und bitte ihn, ihn auszuführen. Wäre er verwirrt, wäre es die KI auch."],
      ["A prompt is the instruction or input with which you tell the AI what to do. Good prompting is no magic, just good instructing.",
       "H:Example: bad and better",
       "Bad: “Write something about our product.” Better: “Write a product description for our customer portal in 80 words. Audience: sales managers. Tone: factual and friendly.”",
       "H:The golden rule",
       "Show your prompt to a colleague who has little context on the task and ask them to carry it out. If they would be confused, the AI would be too."]],
   q:[
    {q:["Was ist ein Prompt?","What is a prompt?"],
     a:[["Die Anweisung oder Eingabe an die KI","Ein Programm, das die KI trainiert","Ein Passwort für die KI","Eine Datei mit Zugangsdaten"],["The instruction or input to the AI","A program that trains the AI","A password for the AI","A file with credentials"]],
     e:["Ein Prompt ist die Eingabe, mit der du der KI sagst, was sie tun soll.","A prompt is the input with which you tell the AI what to do."],
     p:["Prompt = deine Aufgabe in Worten.","Prompt = your task in words."]},
    {q:["Wie lautet die goldene Regel für Prompts?","What is the golden rule for prompts?"],
     a:[["Den Prompt einem Kollegen mit wenig Kontext zeigen","Den Prompt möglichst kurz halten","Den Prompt immer auf Englisch schreiben","Den Prompt dreimal hintereinander senden"],["Show the prompt to a colleague with little context","Keep the prompt as short as possible","Always write the prompt in English","Send the prompt three times in a row"]],
     e:["Wäre der Kollege verwirrt, wäre es die KI auch.","If the colleague would be confused, the AI would be too."],
     p:["Teste deinen Prompt an einem Menschen.","Test your prompt on a person."]},
    {q:["Welche Angaben machen den Produkt-Prompt besser?","Which details make the product prompt better?"],
     a:[["Zielgruppe, Länge und Ton nennen","Das Wort bitte dreimal verwenden","Möglichst viele Fachwörter einbauen","Die Frage in Großbuchstaben schreiben"],["Naming audience, length and tone","Using the word please three times","Using as many technical terms as possible","Writing the question in capital letters"]],
     e:["Zielgruppe, Länge und Ton machen die Aufgabe klar.","Audience, length and tone make the task clear."],
     p:["Wer, wie lang, in welchem Ton?","Who, how long, in which tone?"]},
    {q:["Welcher Prompt ist besser?","Which prompt is better?"],
     a:[["Fasse diese E-Mail in drei Sätzen zusammen. Ton: freundlich.","Mach bitte irgendetwas Sinnvolles mit dieser E-Mail.","Schreib etwas zu dieser E-Mail, du weißt schon, was ich meine.","Zusammenfassung, aber nicht zu lang und nicht zu kurz."],["Summarise this email in three sentences. Tone: friendly.","Please do something sensible with this email.","Write something about this email, you know what I mean.","Summary, but not too long and not too short."]],
     e:["Der erste Prompt sagt klar, was, wie lang und in welchem Ton.","The first prompt says clearly what, how long and in which tone."],
     p:["Konkret schlägt vage.","Concrete beats vague."]}]},

 { t:["Klar und direkt sein","Be clear and direct"],
   ben:["Du formulierst klare Anweisungen und nummerierst Schritte, wenn es nötig ist.","You write clear instructions and number steps when needed."],
   l:[["Sei klar und direkt: Sage genau, was du willst. Wenn die Reihenfolge oder Vollständigkeit der Schritte zählt, nummeriere sie oder nutze Aufzählungen.",
       "H:Mehr als das Übliche verlangen",
       "Willst du mehr als das Übliche, musst du es ausdrücklich sagen. Vage: „Erstelle ein Dashboard.“ Besser: „Erstelle ein Dashboard für Verkaufszahlen. Nimm so viele sinnvolle Funktionen wie möglich auf und gehe über die Grundlagen hinaus.“",
       "H:Beispiel mit Schritten",
       "„1. Lies die Kundenmail. 2. Nenne das Problem in einem Satz. 3. Schlage zwei Lösungen vor. 4. Schreibe eine Antwort mit höchstens 100 Wörtern.“"],
      ["Be clear and direct: say exactly what you want. If the order or completeness of steps matters, number them or use bullet points.",
       "H:Asking for more than the usual",
       "If you want more than the usual, you have to say so explicitly. Vague: “Create a dashboard.” Better: “Create a dashboard for sales figures. Include as many useful features as possible and go beyond the basics.”",
       "H:Example with steps",
       "“1. Read the customer email. 2. Name the problem in one sentence. 3. Suggest two solutions. 4. Write a reply of at most 100 words.”"]],
   q:[
    {q:["Wann nummerierst du Schritte im Prompt?","When do you number steps in a prompt?"],
     a:[["Wenn die Reihenfolge der Schritte zählt","Nie, denn Listen verwirren die KI immer","Nur bei sehr kurzen Fragen im Chat","Nur bei Programmcode und bei Tabellen"],["When the order of the steps matters","Never, because lists always confuse the AI","Only for very short questions in a chat","Only for program code and for tables"]],
     e:["Bei Reihenfolge oder Vollständigkeit helfen nummerierte Listen oder Aufzählungen.","Numbered lists or bullet points help when order or completeness matters."],
     p:["Reihenfolge wichtig? Nummeriere.","Order matters? Number it."]},
    {q:["Du willst mehr als das Übliche. Was tust du?","You want more than the usual. What do you do?"],
     a:[["Es ausdrücklich verlangen","Hoffen, dass die KI es errät","Den Prompt möglichst stark kürzen","Das Thema im Gespräch wechseln"],["Ask for it explicitly","Hope that the AI guesses it","Shorten the prompt as much as possible","Change the topic in the conversation"]],
     e:["Wer „über die Grundlagen hinaus“ will, muss das ausdrücklich verlangen.","Whoever wants “beyond the basics” has to ask for it explicitly."],
     p:["Nicht erraten lassen, sondern sagen.","Do not make it guess, say it."]},
    {q:["Was gehört in einen klaren Prompt?","What belongs in a clear prompt?"],
     a:[["Aufgabe, Umfang und gewünschtes Ergebnis","Nur ein einzelnes Stichwort ohne Ziel","Nur eine höfliche Begrüßung am Anfang","Nur der Name der KI, die antworten soll"],["Task, scope and desired result","Only a single keyword","Only a polite greeting","Only the name of the AI"]],
     e:["Ein klarer Prompt nennt, was getan werden soll, in welchem Umfang und mit welchem Ergebnis.","A clear prompt names what should be done, in which scope and with which result."],
     p:["Aufgabe, Umfang, Ergebnis.","Task, scope, result."]},
    {q:["Welcher Prompt ist klarer?","Which prompt is clearer?"],
     a:[["Erstelle ein Dashboard für Verkaufszahlen, mit Diagrammen.","Mach mal ein Dashboard, irgendwas Hübsches und Buntes.","Dashboard bitte, du weißt schon, was ich brauche.","Etwas mit Zahlen und Diagrammen, so wie immer halt."],["Create a dashboard for sales figures, with charts.","Make a dashboard, something pretty and colourful.","Dashboard please, you know what I need.","Something with numbers and charts, as always."]],
     e:["Der erste Prompt nennt Thema und Umfang.","The first prompt names topic and scope."],
     p:["Thema plus Umfang, nicht „wie immer“.","Topic plus scope, not “as usual”."]}],
   dd:{de:{dd:1,q:"Ordne zu: Welcher Baustein beantwortet welche Frage?",slots:["Was soll getan werden?","Für wen ist es gedacht?","Wie lang soll es sein?","In welchem Ton soll es klingen?"],items:["Aufgabe","Zielgruppe","Länge","Ton"],e:"Die Aufgabe sagt, was zu tun ist, die Zielgruppe, für wen, die Länge, wie viel, und der Ton, wie es klingt."},
       en:{dd:1,q:"Match them: which building block answers which question?",slots:["What should be done?","Who is it meant for?","How long should it be?","Which tone should it have?"],items:["Task","Audience","Length","Tone"],e:"The task says what to do, the audience for whom, the length how much and the tone how it sounds."}}},

 { t:["Kontext und Begründung geben","Give context and reasons"],
   ben:["Du erklärst der KI, warum etwas wichtig ist, damit sie besser verallgemeinert.","You explain to the AI why something matters so that it generalises better."],
   l:[["Eine Anweisung wirkt besser, wenn die KI weiß, warum sie gilt. Die Begründung hilft, dein Ziel zu verstehen. Die KI kann aus der Erklärung verallgemeinern.",
       "H:Beispiel aus der Doku",
       "Schwach: „Nutze nie Auslassungspunkte.“ Besser: „Deine Antwort wird von einer Sprachausgabe vorgelesen. Nutze deshalb nie Auslassungspunkte, denn die Sprachausgabe kann sie nicht aussprechen.“",
       "H:Dein Beispiel",
       "Statt „Schreibe kurz.“ lieber: „Die Antwort erscheint in einer Push-Nachricht auf dem Handy, deshalb höchstens 20 Wörter.“"],
      ["An instruction works better when the AI knows why it applies. The reason helps it understand your goal. The AI can generalise from the explanation.",
       "H:Example from the docs",
       "Weak: “Never use ellipses.” Better: “Your response will be read aloud by a text-to-speech engine, so never use ellipses since the engine cannot pronounce them.”",
       "H:Your example",
       "Instead of “Write short.” rather: “The answer appears in a push notification on the phone, so at most 20 words.”"]],
   q:[
    {q:["Warum sollst du Anweisungen begründen?","Why should you give reasons for instructions?"],
     a:[["Die KI kann aus der Begründung verallgemeinern","Die Antwort wird dadurch immer schneller","Die KI muss dann weniger Text lesen","Die Begründung ersetzt jedes Beispiel"],["The AI can generalise from the reason","The answer always gets faster","The AI then has to read less text","The reason replaces every example"]],
     e:["Mit Begründung versteht die KI dein Ziel und kann daraus verallgemeinern.","With a reason the AI understands your goal and can generalise from it."],
     p:["Nicht nur was, auch warum.","Not only what, also why."]},
    {q:["Warum ist „keine Auslassungspunkte“ mit Begründung besser?","Why is “no ellipses” better with a reason?"],
     a:[["Die KI versteht: Eine Sprachausgabe spricht sie nicht aus","Auslassungspunkte sind in dem Programm verboten","Die KI mag grundsätzlich keine Satzzeichen","Die Antwort wird dadurch deutlich länger"],["The AI sees that a speech engine cannot say them","Ellipses are forbidden in the program","The AI does not like punctuation in general","The answer gets noticeably longer as a result"]],
     e:["Die Begründung (Sprachausgabe) erklärt den Sinn der Regel.","The reason (speech engine) explains the point of the rule."],
     p:["Mit Grund wird aus einer Regel ein Verständnis.","With a reason a rule becomes understanding."]},
    {q:["Welcher Prompt liefert mehr Kontext?","Which prompt provides more context?"],
     a:[["Höchstens 20 Wörter, weil die Antwort als Push-Nachricht erscheint.","Schreibe kurz, aber so, dass es gut klingt und passt.","Antworte bitte knapp, aber auf keinen Fall zu knapp.","Nicht zu viel Text schreiben, aber auch nicht zu wenig."],["At most 20 words, because the answer appears as a push notification.","Write short, but make sure it sounds good and fits.","Answer briefly, please, but never far too briefly.","Not too much text, but also not too little text."]],
     e:["Der erste Prompt nennt den Einsatzort und die Grenze.","The first prompt names the place of use and the limit."],
     p:["Einsatzort nennen: Push, Mail, Bericht.","Name the place of use: push, mail, report."]},
    {q:["Was bewirkt eine gute Begründung noch?","What else does a good reason do?"],
     a:[["Die KI trifft auch in ähnlichen Fällen bessere Entscheidungen","Die KI vergisst dadurch alle früheren Regeln im Gespräch","Die KI antwortet danach nur noch in Aufzählungslisten","Die KI schaltet dadurch zusätzliche Werkzeuge frei"],["The AI also makes better decisions in similar cases","The AI forgets all earlier rules in the conversation","The AI only answers in bullet lists afterwards","The AI unlocks additional tools as a result"]],
     e:["Wer das Warum kennt, kann auf ähnliche Fälle schließen.","Whoever knows the why can infer similar cases."],
     p:["Warum = Übertragbarkeit.","Why = transferability."]}]},

 { t:["Beispiele geben","Give examples"],
   ben:["Du steuerst Format und Ton mit gut gewählten Beispielen.","You steer format and tone with well-chosen examples."],
   l:[["Beispiele gehören zu den zuverlässigsten Wegen, Format, Ton und Struktur der Antwort zu steuern. Das nennt man Few-Shot oder Multishot-Prompting.",
       "H:Worauf es ankommt",
       "Nimm drei bis fünf Beispiele für das beste Ergebnis. Sie sollen relevant (passen zum echten Einsatz), vielfältig (decken verschiedene Fälle ab) und strukturiert sein. Packe jedes Beispiel in <example>-Tags, mehrere in <examples>.",
       "H:Beispiel",
       "<examples><example>Eingabe: Rechnung zu spät. Ausgabe: Zahlungserinnerung</example><example>Eingabe: Frage zur Lieferzeit. Ausgabe: Lieferauskunft</example></examples> Danach folgt die neue Eingabe, die die KI einordnen soll."],
      ["Examples are among the most reliable ways to steer the format, tone and structure of the answer. This is called few-shot or multishot prompting.",
       "H:What matters",
       "Use three to five examples for the best result. They should be relevant (fit the real use), diverse (cover different cases) and structured. Wrap each example in <example> tags, several in <examples>.",
       "H:Example",
       "<examples><example>Input: invoice late. Output: payment reminder</example><example>Input: question about delivery time. Output: delivery information</example></examples> Then comes the new input that the AI should classify."]],
   q:[
    {q:["Wie viele Beispiele sind laut Doku ein guter Richtwert?","How many examples are a good rule of thumb according to the docs?"],
     a:[["Drei bis fünf","Genau eines","Mindestens fünfzig","Keines, Beispiele schaden"],["Three to five","Exactly one","At least fifty","None, examples are harmful"]],
     e:["Die Doku empfiehlt drei bis fünf Beispiele für beste Ergebnisse.","The docs recommend three to five examples for best results."],
     p:["3–5: nicht zu wenig, nicht zu viele.","3–5: not too few, not too many."]},
    {q:["Welche Eigenschaften sollen Beispiele haben?","Which properties should examples have?"],
     a:[["Relevant, vielfältig und strukturiert","Lang, laut und teuer","Zufällig, geheim und alt","Kurz, gleich und unleserlich"],["Relevant, diverse and structured","Long, loud and expensive","Random, secret and old","Short, identical and unreadable"]],
     e:["Beispiele sollen relevant, vielfältig und strukturiert sein.","Examples should be relevant, diverse and structured."],
     p:["R-V-S: relevant, vielfältig, strukturiert.","R-D-S: relevant, diverse, structured."]},
    {q:["Womit kennzeichnest du Beispiele im Prompt?","How do you mark examples in the prompt?"],
     a:[["Mit <example>-Tags, mehrere in <examples>","Mit roter Schrift mitten im Text des Prompts","Mit einer Fußnote ganz am Ende des Prompts","Mit einem Passwort vor jedem Beispiel"],["With <example> tags, several in <examples>","With red text in the middle of the prompt","With a footnote at the very end of the prompt","With a password before every example"]],
     e:["Jedes Beispiel steht in <example>, mehrere gemeinsam in <examples>.","Each example goes in <example>, several together in <examples>."],
     p:["Tags trennen Beispiele von Anweisungen.","Tags separate examples from instructions."]},
    {q:["Wofür sind Beispiele besonders gut?","What are examples especially good for?"],
     a:[["Für Format, Ton und Struktur der Antwort","Um die KI zu verlangsamen","Um das Kontextfenster zu vergrößern","Um Zugangsdaten zu speichern"],["For the format, tone and structure of the answer","To slow the AI down on purpose","To enlarge the context window of the model","To store credentials safely in the prompt"]],
     e:["Beispiele sind einer der zuverlässigsten Wege, Format, Ton und Struktur zu steuern.","Examples are one of the most reliable ways to steer format, tone and structure."],
     p:["Zeigen statt nur beschreiben.","Show instead of only describing."]}],
   dd:{de:{dd:1,q:"Ordne zu: Welche Eigenschaft eines guten Beispiels ist gemeint?",slots:["Es passt zum echten Einsatz","Es deckt unterschiedliche Fälle ab","Es ist mit Tags klar abgegrenzt"],items:["Relevant","Vielfältig","Strukturiert"],e:"Relevant passt zum Einsatz, vielfältig deckt verschiedene Fälle ab, strukturiert ist klar mit Tags abgegrenzt."},
       en:{dd:1,q:"Match them: which property of a good example is meant?",slots:["It fits the real use","It covers different cases","It is clearly delimited with tags"],items:["Relevant","Diverse","Structured"],e:"Relevant fits the use, diverse covers different cases, structured is clearly delimited with tags."}}},

 { t:["Struktur mit Tags und eine Rolle","Structure with tags and a role"],
   ben:["Du trennst Anweisungen, Kontext und Eingaben mit Tags und setzt eine Rolle.","You separate instructions, context and inputs with tags and set a role."],
   l:[["Bei längeren Prompts hilft Struktur. Mit XML-Tags trennst du Anweisungen, Kontext und Eingaben. Das verringert Missverständnisse.",
       "H:Regeln für Tags",
       "Nutze gleichbleibende, beschreibende Tag-Namen, zum Beispiel <instructions>, <context> und <input>. Verschachtele Tags, wenn der Inhalt eine Hierarchie hat, zum Beispiel <documents> mit mehreren <document index=\"1\">.",
       "H:Eine Rolle setzen",
       "Eine Rolle im System-Prompt richtet Verhalten und Ton auf deinen Einsatz aus. Schon ein Satz hilft: „You are a helpful coding assistant specializing in Python.“ Auf Deutsch: „Du bist ein hilfreicher Assistent für Support-Antworten.“"],
      ["For longer prompts structure helps. With XML tags you separate instructions, context and inputs. This reduces misunderstandings.",
       "H:Rules for tags",
       "Use consistent, descriptive tag names, for example <instructions>, <context> and <input>. Nest tags when the content has a hierarchy, for example <documents> with several <document index=\"1\">.",
       "H:Setting a role",
       "A role in the system prompt focuses behaviour and tone on your use case. Even a single sentence helps: “You are a helpful coding assistant specializing in Python.”"]],
   q:[
    {q:["Wozu nutzt du XML-Tags im Prompt?","What do you use XML tags in a prompt for?"],
     a:[["Sie trennen Anweisungen, Kontext und Eingaben klar","Sie machen den Prompt immer kürzer","Sie schalten das Nachdenken der KI ein","Sie verschlüsseln den Inhalt des Prompts"],["They clearly separate instructions, context and inputs","They always make every prompt much shorter","They switch on the thinking of the AI model","They encrypt the whole content of the prompt"]],
     e:["Tags trennen Anweisungen, Kontext und Eingaben und verringern Missverständnisse.","Tags separate instructions, context and inputs and reduce misunderstandings."],
     p:["Tags = Schubladen für den Prompt.","Tags = drawers for the prompt."]},
    {q:["Wie sollen Tag-Namen sein?","What should tag names be like?"],
     a:[["Gleichbleibend und beschreibend","Zufällig und möglichst kurz","Bei jedem Prompt neu und anders","Nur Zahlen ohne Buchstaben"],["Consistent and descriptive","Random and as short as possible","New and different in every prompt","Only numbers without letters"]],
     e:["Nutze gleichbleibende, beschreibende Tag-Namen über deine Prompts hinweg.","Use consistent, descriptive tag names across your prompts."],
     p:["Gleiche Aufgabe, gleiche Tag-Namen.","Same job, same tag names."]},
    {q:["Wohin gehört die Rolle der KI?","Where does the role of the AI belong?"],
     a:[["In den System-Prompt","In die Fußzeile der Antwort","In den Dateinamen","In die Tabellenüberschrift"],["In the system prompt","In the footer of the answer","In the file name","In the table heading"]],
     e:["Eine Rolle im System-Prompt richtet Verhalten und Ton aus.","A role in the system prompt focuses behaviour and tone."],
     p:["System-Prompt = Dauerauftrag.","System prompt = standing order."]},
    {q:["Was bewirkt eine Rolle?","What does a role do?"],
     a:[["Sie richtet Verhalten und Ton auf deinen Einsatz aus","Sie vergrößert das Kontextfenster","Sie löscht den bisherigen Gesprächsverlauf","Sie gibt Zugriff auf deine Dateien"],["It focuses behaviour and tone on your use case","It enlarges the context window","It deletes the previous conversation","It gives access to your files"]],
     e:["Auch ein einzelner Satz zur Rolle macht einen Unterschied.","Even a single sentence about the role makes a difference."],
     p:["Eine Rolle = ein Satz Haltung.","A role = one sentence of attitude."]}]},

 { t:["Das Ausgabeformat steuern","Steering the output format"],
   ben:["Du formulierst Formatwünsche positiv und kennst eine wichtige Änderung bei Prefill.","You phrase format wishes positively and know an important change regarding prefill."],
   l:[["Sage der KI, was sie tun soll, nicht nur, was sie lassen soll. Das steuert das Format zuverlässiger.",
       "H:Positiv formulieren",
       "Statt „Nutze kein Markdown“ besser: „Deine Antwort besteht aus fließenden Absätzen in Prosa.“ Der Stil deines Prompts färbt auf die Antwort ab: Wenn du selbst weniger Markdown nutzt, nutzt die KI oft weniger davon.",
       "H:Mit Beispielen und Tags",
       "Zeige das gewünschte Format an einem Beispiel oder fordere die Antwort in Tags an, zum Beispiel in <answer>. Beispiele sind einer der zuverlässigsten Wege, das Format zu steuern.",
       "FOLD:Für Profis|Prefill gibt es nicht mehr überall","Vorbefüllte Antworten (Prefill) auf dem letzten Assistant-Turn werden ab Claude 4.6 nicht mehr unterstützt und führen dort zu einem Fehler. Alternativen laut Doku: Structured Outputs, Anweisung wie „Antworte direkt ohne Vorrede“ oder Tags und Nachbearbeitung.","ENDFOLD"],
      ["Tell the AI what to do, not only what to avoid. This steers the format more reliably.",
       "H:Phrase it positively",
       "Instead of “Do not use markdown” better: “Your response should be composed of smoothly flowing prose paragraphs.” The style of your prompt colours the answer: if you use less markdown yourself, the AI often uses less too.",
       "H:With examples and tags",
       "Show the desired format in an example or ask for the answer in tags, for example in <answer>. Examples are one of the most reliable ways to steer the format.",
       "FOLD:For professionals|Prefill is no longer available everywhere","Prefilled responses on the last assistant turn are no longer supported from Claude 4.6 and return an error there. Alternatives according to the docs: structured outputs, an instruction such as “Respond directly without preamble” or tags and post-processing.","ENDFOLD"]],
   q:[
    {q:["Was ist besser als „Nutze kein Markdown“?","What is better than “Do not use markdown”?"],
     a:[["Deine Antwort besteht aus fließenden Absätzen in Prosa","Nutze bitte wirklich überhaupt kein Markdown","Markdown ist für dich streng verboten","Antworte ganz ohne Satzzeichen und Zeichen"],["Your response consists of smoothly flowing prose paragraphs","Please really use no markdown at all","Markdown is strictly forbidden for you","Answer without any punctuation or characters"]],
     e:["Sage, was die KI tun soll, statt nur, was sie nicht tun soll.","Say what the AI should do instead of only what it should not do."],
     p:["Positiv formulieren: tun statt lassen.","Phrase positively: do instead of avoid."]},
    {q:["Wie wirkt der Stil deines Prompts auf die Antwort?","How does the style of your prompt affect the answer?"],
     a:[["Er färbt auf den Stil der Antwort ab","Er hat überhaupt keinen Einfluss","Er ändert nur die Schriftart der Antwort","Er legt die Wortzahl genau fest"],["It colours the style of the answer","It has no influence at all","It only changes the font of the answer","It sets the word count exactly"]],
     e:["Der Stil des Prompts färbt auf die Antwort ab; wenig Markdown im Prompt führt oft zu weniger Markdown in der Antwort.","The style of the prompt colours the answer; little markdown in the prompt often leads to less markdown in the answer."],
     p:["Schreibe so, wie die Antwort aussehen soll.","Write the way the answer should look."]},
    {q:["Womit steuerst du das Format besonders zuverlässig?","What steers the format especially reliably?"],
     a:[["Mit Beispielen","Mit Großbuchstaben","Mit mehr Höflichkeit","Mit längeren Titeln"],["With examples","With capital letters","With more politeness","With longer titles"]],
     e:["Beispiele sind einer der zuverlässigsten Wege, Format, Ton und Struktur zu steuern.","Examples are one of the most reliable ways to steer format, tone and structure."],
     p:["Beispiel schlägt Beschreibung.","Example beats description."]},
    {q:["Was gilt für vorbefüllte Antworten (Prefill) bei neueren Modellen?","What applies to prefilled responses with newer models?"],
     a:[["Sie werden ab Claude 4.6 nicht mehr unterstützt","Sie sind bei allen Modellen immer Pflicht","Sie machen jede Antwort automatisch kürzer","Sie wirken nur bei Bildern und Fotos"],["They are no longer supported from Claude 4.6","They are mandatory with all models","They automatically make every answer shorter","They only work with images and photos"]],
     e:["Ab Claude 4.6 führt Prefill auf dem letzten Assistant-Turn zu einem Fehler. Alternativen: Structured Outputs oder klare Anweisungen.","From Claude 4.6 prefill on the last assistant turn returns an error. Alternatives: structured outputs or clear instructions."],
     p:["Modellabhängig: prüfe die Doku zu deinem Modell.","Model dependent: check the docs for your model."]}],
   dd:{de:{dd:1,q:"Ordne zu: Welche positive Formulierung passt zur Verneinung?",slots:["Nutze kein Markdown","Schreib nicht so lang","Keine Fachwörter","Sei nicht unfreundlich"],items:["Schreibe in fließenden Absätzen","Antworte in höchstens drei Sätzen","Erkläre es in Alltagssprache","Schreibe freundlich und zugewandt"],e:"Jede Verneinung wird zu einer positiven Anweisung: was die KI stattdessen tun soll."},
       en:{dd:1,q:"Match them: which positive phrasing fits the negation?",slots:["Do not use markdown","Do not write so long","No technical terms","Do not be unfriendly"],items:["Write in flowing paragraphs","Answer in at most three sentences","Explain it in everyday language","Write in a friendly and warm tone"],e:"Every negation becomes a positive instruction: what the AI should do instead."}}},

 { t:["Lange Dokumente und Belege","Long documents and evidence"],
   ben:["Du ordnest lange Eingaben richtig an und senkst das Risiko erfundener Antworten.","You arrange long inputs correctly and lower the risk of invented answers."],
   l:[["Bei langen Dokumenten kommt es auf die Reihenfolge an: Lege die Dokumente an den Anfang des Prompts, über Frage, Anweisungen und Beispiele. Die Frage steht am Ende. In Tests konnte das die Qualität um bis zu 30 Prozent verbessern, besonders bei komplexen Eingaben mit mehreren Dokumenten. Das ist kein Garantiewert.",
       "H:Struktur und Zitate",
       "Kapsle jedes Dokument, zum Beispiel <document index=\"1\"> mit <source> und <document_content>. Lass die KI zuerst die relevanten Zitate herausziehen und erst dann die Aufgabe lösen.",
       "H:Gegen Erfindungen",
       "Erlaube der KI ausdrücklich, „Ich weiß es nicht“ zu sagen. Verlange zu jeder Aussage ein Zitat und lass sie die Aussage zurückziehen, wenn sie keins findet. Diese Mittel reduzieren Fehler, schließen sie aber nicht aus: Prüfe wichtige Angaben selbst."],
      ["For long documents the order matters: put the documents at the top of the prompt, above the question, instructions and examples. The question comes last. In tests this could improve quality by up to 30 percent, especially for complex inputs with several documents. This is not a guaranteed value.",
       "H:Structure and quotes",
       "Wrap each document, for example <document index=\"1\"> with <source> and <document_content>. Let the AI first extract the relevant quotes and only then solve the task.",
       "H:Against inventions",
       "Explicitly allow the AI to say “I don't know”. Ask for a quote for every statement and let it retract the statement if it finds none. These measures reduce errors but do not eliminate them: check important information yourself."]],
   q:[
    {q:["Wohin gehören lange Dokumente im Prompt?","Where do long documents belong in the prompt?"],
     a:[["An den Anfang, oberhalb der Frage","Ans Ende, hinter die Frage","In den Dateinamen der Antwort","In die Fußzeile des Gesprächs"],["At the top, above the question","At the end, after the question","In the file name of the answer","In the footer of the conversation"]],
     e:["Dokumente stehen oben, Frage und Anweisungen darunter. Das verbessert die Leistung über alle Modelle.","Documents go on top, question and instructions below. This improves performance across all models."],
     p:["Erst das Material, dann die Frage.","First the material, then the question."]},
    {q:["Was lässt du bei langen Dokumenten zuerst tun?","What do you let the AI do first with long documents?"],
     a:[["Relevante Zitate herausziehen","Das Dokument übersetzen","Das Dokument kürzen","Alles ungeprüft zusammenfassen"],["Extract relevant quotes","Translate the document","Shorten the document","Summarise everything unchecked"]],
     e:["Lass die KI zuerst relevante Zitate herausziehen und dann die Aufgabe lösen.","Let the AI first extract relevant quotes and then solve the task."],
     p:["Zitate sind die Beweisstücke.","Quotes are the evidence."]},
    {q:["Was hilft gegen erfundene Antworten?","What helps against invented answers?"],
     a:[["Der KI erlauben zu sagen: Ich weiß es nicht","Die KI zu mehr Selbstbewusstsein auffordern","Die Frage so kurz wie möglich halten","Alle Quellen aus dem Prompt entfernen"],["Allow the AI to say: I don't know","Ask the AI to be more confident","Keep the question as short as possible","Remove all sources from the prompt"]],
     e:["Die ausdrückliche Erlaubnis, Unsicherheit zuzugeben, reduziert Erfindungen.","Explicit permission to admit uncertainty reduces inventions."],
     p:["Nicht wissen darf erlaubt sein.","Not knowing may be allowed."]},
    {q:["Wie verlässlich sind Maßnahmen gegen Halluzinationen?","How reliable are measures against hallucinations?"],
     a:[["Sie reduzieren Fehler, schließen sie aber nicht aus","Sie schließen Fehler dadurch vollständig aus","Sie wirken nur bei Zahlen und Tabellen","Sie wirken nur bei Bildern und Fotos"],["They reduce errors but do not eliminate them","They eliminate errors completely","They only work for numbers","They only work for images"]],
     e:["Die Maßnahmen reduzieren Halluzinationen, aber wichtige Angaben solltest du immer prüfen.","The measures reduce hallucinations, but you should always validate important information."],
     p:["Vertrauen ja, Kontrolle auch.","Trust yes, control too."]}]},

 { t:["Denken, prüfen und verketten","Thinking, checking and chaining"],
   ben:["Du nutzt Denken, Selbstprüfung und Verkettung gezielt.","You use thinking, self-checking and chaining purposefully."],
   l:[["Aktuelle Modelle denken oft von selbst nach (adaptives Thinking). Bei vielen Modellen ist es immer oder standardmäßig an. Die Doku rät: allgemeine Anweisungen wie „Denke gründlich nach“ führen oft zu besseren Ergebnissen als ein handgeschriebener Schrittplan.",
       "H:Selbst prüfen lassen",
       "Hänge an: „Prüfe vor dem Abschluss deine Antwort gegen diese Kriterien: …“ Das fängt Fehler zuverlässig ab, besonders bei Code und Mathematik.",
       "H:Verketten",
       "Das häufigste Muster ist die Selbstkorrektur: Entwurf erstellen, ihn gegen Kriterien prüfen lassen, ihn nach der Prüfung verbessern. Explizites Verketten lohnt sich, wenn du Zwischenergebnisse sehen oder einen festen Ablauf erzwingen willst.",
       "FOLD:Für Profis|Modellabhängig","Hinweise zu Thinking, zur Selbstprüfung und zu Formulierungen unterscheiden sich je nach Modell (zum Beispiel bei Opus 5 kann die Selbstprüfung zu Über-Verifikation führen). Lies die Doku zu deinem Modell und prüfe Prompt-Tricks mit eigenen Tests.","ENDFOLD"],
      ["Current models often think on their own (adaptive thinking). For many models it is always on or on by default. The docs advise: general instructions such as “Think thoroughly” often lead to better results than a hand-written step-by-step plan.",
       "H:Let it check itself",
       "Append: “Before you finish, verify your answer against these criteria: …” This reliably catches errors, especially for code and maths.",
       "H:Chaining",
       "The most common pattern is self-correction: create a draft, have it checked against criteria, improve it after the review. Explicit chaining is worthwhile when you want to see intermediate results or enforce a fixed process.",
       "FOLD:For professionals|Model dependent","Notes on thinking, self-checking and phrasing differ by model (for example with Opus 5 self-checking can lead to over-verification). Read the docs for your model and test prompt tricks with your own tests.","ENDFOLD"]],
   q:[
    {q:["Was ist oft besser als ein handgeschriebener Schrittplan?","What is often better than a hand-written step-by-step plan?"],
     a:[["Eine allgemeine Anweisung wie „Denke gründlich nach“","Ein noch längerer und genauerer Schrittplan","Ein Plan nur in Großbuchstaben geschrieben","Gar keine Aufgabe im Prompt zu nennen"],["A general instruction such as “Think thoroughly”","An even longer and more detailed step plan","A plan written only in capital letters","Not naming any task in the prompt at all"]],
     e:["Die Doku rät zu allgemeinen Anweisungen statt vorgeschriebener Schritte.","The docs advise general instructions over prescriptive steps."],
     p:["Ziel nennen, Weg offen lassen.","Name the goal, leave the path open."]},
    {q:["Was hängst du an, um Fehler abzufangen?","What do you append to catch errors?"],
     a:[["Prüfe vor dem Abschluss deine Antwort gegen diese Kriterien","Sei bitte nicht falsch und nicht ungenau, danke","Antworte jetzt bitte schneller und etwas kürzer","Wiederhole bitte zweimal meine ganze Frage"],["Before you finish, verify your answer against these criteria","Please do not be wrong and not inaccurate, thanks","Please answer faster and a little shorter now","Please repeat my whole question twice first"]],
     e:["Eine Prüfanweisung mit Kriterien fängt Fehler zuverlässig ab.","A verification instruction with criteria reliably catches errors."],
     p:["Prüfen heißt: gegen Kriterien.","Checking means: against criteria."]},
    {q:["Welches Verkettungsmuster nennt die Doku als häufigstes?","Which chaining pattern does the doc name as the most common?"],
     a:[["Selbstkorrektur: Entwurf, Prüfung, Verbesserung","Zufallsauswahl unter mehreren Antworten","Alles löschen und neu beginnen","Übersetzen und wieder zurück"],["Self-correction: draft, review, refinement","Random choice among several answers","Delete everything and start again","Translate and back again"]],
     e:["Das häufigste Muster ist die Selbstkorrektur: Entwurf, Prüfung gegen Kriterien, Verbesserung.","The most common pattern is self-correction: draft, review against criteria, refinement."],
     p:["Entwurf → Prüfen → Verbessern.","Draft → check → improve."]},
    {q:["Wann lohnt sich explizites Verketten weiterhin?","When is explicit chaining still worthwhile?"],
     a:[["Wenn Zwischenergebnisse sichtbar sein sollen","Nie, denn es ist immer völlig überflüssig","Nur bei sehr kurzen Prompts mit einem Satz","Nur bei Bildern und bei Fotos im Gespräch"],["When intermediate results should be visible","Never, because it is always superfluous","Only for very short one-sentence prompts","Only for images and photos in the chat"]],
     e:["Verketten lohnt sich, wenn Zwischenergebnisse sichtbar sein oder eine feste Pipeline-Struktur gelten soll.","Chaining pays off when intermediate outputs should be visible or a fixed pipeline structure should apply."],
     p:["Verketten = kontrollierte Etappen.","Chaining = controlled stages."]}],
   dd:{de:{dd:1,q:"Bringe die Selbstkorrektur in die richtige Reihenfolge.",slots:["Schritt 1","Schritt 2","Schritt 3"],items:["Entwurf erstellen","Entwurf gegen Kriterien prüfen","Entwurf nach der Prüfung verbessern"],e:"Erst entsteht der Entwurf, dann wird er gegen Kriterien geprüft, danach wird er verbessert."},
       en:{dd:1,q:"Put the self-correction into the right order.",slots:["Step 1","Step 2","Step 3"],items:["Create a draft","Check the draft against criteria","Improve the draft after the review"],e:"First the draft is created, then it is checked against criteria, then it is improved."}}},

 { t:["Agentische Prompts","Agentic prompts"],
   ben:["Du steuerst, ob die KI handelt oder nur vorschlägt, und begrenzt ihren Umfang.","You steer whether the AI acts or only suggests and limit its scope."],
   l:[["Arbeitet die KI mit Werkzeugen (Agent), brauchst du klare Regeln: Soll sie handeln oder nur vorschlagen? Wie viel darf sie tun? Wann soll sie nachfragen?",
       "H:Handeln oder vorschlagen",
       "„Kannst du Änderungen vorschlagen?“ führt oft zu Vorschlägen statt Umsetzung. „Ändere diese Funktion, damit sie schneller läuft.“ führt zur Umsetzung. Willst du das Standardverhalten festlegen, schreibe es in den System-Prompt.",
       "H:Parallel und begrenzt",
       "Unabhängige Tool-Aufrufe können parallel laufen. Verlange, keine Platzhalter zu verwenden und fehlende Parameter nicht zu raten. Begrenze den Umfang: nur Änderungen, die verlangt oder klar nötig sind. Das vermeidet Overengineering (Übertechnisierung). Vor riskanten Schritten soll die KI nachfragen."],
      ["When the AI works with tools (agent), you need clear rules: should it act or only suggest? How much may it do? When should it ask?",
       "H:Act or suggest",
       "“Can you suggest changes?” often leads to suggestions instead of implementation. “Change this function so it runs faster.” leads to implementation. If you want to set the default behaviour, write it into the system prompt.",
       "H:Parallel and limited",
       "Independent tool calls can run in parallel. Ask the AI not to use placeholders and not to guess missing parameters. Limit the scope: only changes that are requested or clearly necessary. This avoids over-engineering. Before risky steps the AI should ask."]],
   q:[
    {q:["Was passiert oft bei „Kannst du Änderungen vorschlagen?“","What often happens with “Can you suggest changes?”"],
     a:[["Die KI liefert Vorschläge, statt umzusetzen","Die KI setzt alles sofort und ungefragt um","Die KI antwortet überhaupt nicht darauf","Die KI löscht die betroffene Datei"],["The AI delivers suggestions instead of implementing","The AI implements everything immediately unasked","The AI does not answer at all","The AI deletes the affected file"]],
     e:["Die Frage nach Vorschlägen führt oft zu Vorschlägen statt zur Umsetzung.","Asking for suggestions often leads to suggestions instead of implementation."],

    {q:["Wie sorgst du dafür, dass die KI etwas umsetzt?","How do you make sure the AI implements something?"],
     a:[["Direkt anweisen: Ändere diese Funktion","Mit „Vielleicht könntest du irgendwann mal …“","Mit mehreren Fragezeichen am Satzende","Mit einem Emoji am Anfang des Prompts"],["Instruct directly: Change this function","With “Maybe you could sometime …”","With several question marks at the end","With an emoji at the start of the prompt"]],
     e:["Eine direkte Anweisung führt zur Umsetzung.","A direct instruction leads to implementation."],

    {q:["Was gilt für unabhängige Tool-Aufrufe?","What applies to independent tool calls?"],

     e:["Unabhängige Tool-Aufrufe lassen sich parallel ausführen. Fehlende Parameter sollen nicht geraten werden.","Independent tool calls can be run in parallel. Missing parameters should not be guessed."],

    {q:["Wie vermeidest du Overengineering?","How do you avoid over-engineering?"],

     e:["Begrenze die KI auf Änderungen, die direkt verlangt oder klar nötig sind.","Limit the AI to changes that are directly requested or clearly necessary."],
     p:["So wenig Komplexität wie nötig.","As little complexity as needed."]}]},

 { t:["Profi: testen, verbessern, absichern","Professional: test, improve, secure"],

   l:[["Professionelle Prompts entstehen nicht beim ersten Versuch, sondern durch Testen. Lege zuerst Erfolgskriterien fest: spezifisch, messbar, erreichbar und relevant. Sammle Testfälle, auch Randfälle, und teste möglichst automatisiert.",

function copyText(s){
  try{ if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s).then(() => true, () => false); }catch(e){}
  try{ const ta = document.createElement("textarea"); ta.value = s; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return Promise.resolve(ok); }catch(e){ return Promise.resolve(false); }
}
const EXT_TARGET = "professionelleprompten";
let extWin = null;
function openExt(url){
  // 1. schon geöffnetes Fenster wiederverwenden (eigener Griff, unabhängig vom Fensternamen)
  try{ if(extWin && !extWin.closed){ extWin.location.href = url; extWin.focus(); return; } }catch(e){ extWin = null; }
  // 2. sonst ein Fenster mit festem Namen öffnen (findet ein vorhandenes Fenster gleichen Namens)
  let w = null;
  try{ w = window.open(url, EXT_TARGET); }catch(e){}
  if(w){ extWin = w; try{ w.opener = null; w.focus(); }catch(e){} return; }
  copyText(url).then(ok => toast((ok ? t("linkCopied") : t("linkBlocked")) + " " + url));
}

  const d = document.createElement("details"); d.className = "fold"; d.open = was;
  const sm = document.createElement("summary"); sm.textContent = title; d.appendChild(sm);
  const body = document.createElement("div"); body.className = "foldb"; build(body); d.appendChild(body); u.appendChild(d);

}

function certRender(){ $("cprev").innerHTML = certSvg(["100%", "auto"]); }
function certCanvas(cb){
  const img = new Image();
  img.onload = () => { const cv = document.createElement("canvas"); cv.width = 2480; cv.height = 1754; const x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 2480, 1754); x.drawImage(img, 0, 0, 2480, 1754); cb(cv); };
  img.onerror = () => { $("cmsg").textContent = "Fehler / Error"; $("cmsg").classList.remove("hide"); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(certSvg([2480, 1754]));
}
function certFileName(ext){ const n = (certLoad().name || "").trim().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, ""); return t("cFile") + (n ? "-" + n : "") + "." + ext; }
function certSaveBlob(blob, fn){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function certPdfBlob(jpeg, w, h){
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = d => { const b = typeof d === "string" ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(n + " 0 obj\n" + body + "\nendobj\n"); };
  push("%PDF-1.4\n");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  offs[4] = len; push("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + w + " /Height " + h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n"); push(jpeg); push("\nendstream\nendobj\n");
  const cs = "q 841.89 0 0 595.28 0 0 cm /Im0 Do Q";
  obj(5, "<< /Length " + cs.length + " >>\nstream\n" + cs + "\nendstream");
  const xr = len; let x = "xref\n0 6\n0000000000 65535 f \n";
  for(let n = 1; n <= 5; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  push(x + "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xr + "\n%%EOF");
  return new Blob(parts, {type: "application/pdf"});
}
function certDownload(kind){
  if(!(certLoad().name || "").trim()){ $("cmsg").textContent = t("certNeed"); $("cmsg").classList.remove("hide"); $("cname").focus(); return; }
  $("cmsg").classList.add("hide");
  certCanvas(cv => {
    if(kind === "png") cv.toBlob(b => certSaveBlob(b, certFileName("png")), "image/png");
    else { const bin = atob(cv.toDataURL("image/jpeg", 0.93).split(",")[1]), u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); certSaveBlob(certPdfBlob(u, cv.width, cv.height), certFileName("pdf")); }
  });
}
function openCert(){

}
